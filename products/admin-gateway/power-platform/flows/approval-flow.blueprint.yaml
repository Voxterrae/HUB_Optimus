name: Optimus-Admin-Gateway-Approval
version: 0.2.0
trigger:
  type: DataverseRowAddedOrModified
  table: opt_adminrequest
  filter: opt_mutation eq true and opt_dryrun eq false and opt_requeststate eq 884831003
load:
  columns:
    - opt_operationkey
    - opt_plandigest
    - opt_parametersjson
    - opt_risk
    - opt_requesterobjectkey
    - opt_targetsummary
    - opt_reason
    - opt_changeticket
steps:
  - load_request_and_exact_plan
  - verify_requester_is_not_approver
  - verify_plan_digest_is_sha256
  - start_approval:
      approval_type: ApproveRejectFirstToRespond
      title: "Optimus admin change: @{opt_operationkey}"
      details:
        - opt_targetsummary
        - opt_risk
        - opt_plandigest
        - opt_reason
        - opt_changeticket
  - on_approve:
      - capture_approved_at_from_utc_approval_decision
      - sign_v1_length_prefixed_receipt_using_tenant_service
      - persist_complete_signed_approval_receipt:
          table: opt_adminapproval
          decision: 884832000
          bind_request_lookup: true
      - update_request_state: 884831004
      - call_gateway_execute_with_original_parameters
  - on_reject:
      - create_opt_adminapproval:
          decision: 884832001
          bind_request_lookup: true
      - update_request_state: 884831005
      - notify_requester
controls:
  mutation_only: true
  dry_run_must_be_false: true
  disallow_self_approval: true
  preserve_original_plan_digest: true
  numeric_choice_values_only: true
  receipt_plan_hash_source: opt_plandigest
  approved_at_source: utc_approval_decision
  signature_profile: hmac-sha256-lp-v1
  signature_algorithm: hmac-sha256
  signature_encoding: lowercase-hex-64
  signature_material:
    domain_ascii: HUB_OPTIMUS_APPROVAL_RECEIPT
    domain_suffix_hex: "00"
    ordered_field_count: 5
    field_count_prefix: none
    field_encoding: utf-8-strict
    length_prefix: uint32-big-endian
    bom: forbidden
    separator: none
    trailing_bytes: forbidden
    unicode_normalization: none
    timestamp_encoding: utc-plus-00:00-seconds-with-optional-six-digit-fraction
    secret_encoding: utf-8-exact-no-trim-or-base64
    secret_minimum_bytes: 32
    secret_scope: dedicated-per-tenant-environment-purpose
    binary_framing_owner: tenant_signer_service
    legacy_fallback: false
  signed_receipt_fields:
    - signature_profile
    - approval_id
    - plan_hash
    - approved_by
    - approved_at
  automatic_send_email: false
