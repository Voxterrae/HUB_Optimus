[package]
name = "hub-relay-bootstrap-inventory"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false
license-file = "../../../../IP_NOTICE.md"

[lib]
name = "bootstrap_inventory"
path = "src/lib.rs"

[[bin]]
name = "hub-relay-bootstrap-inventory"
path = "src/main.rs"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Wdk_Foundation", "Wdk_Storage_FileSystem", "Win32_Foundation", "Win32_Globalization", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_IO", "Win32_System_Memory", "Win32_System_Threading", "Win32_UI_Shell"] }
