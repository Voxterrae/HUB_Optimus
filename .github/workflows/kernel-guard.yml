name: Kernel Guard

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - labeled
      - unlabeled

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect override label
        id: labels
        run: |
          if [[ "${{ contains(github.event.pull_request.labels.*.name, 'allow-kernel-change') }}" == "true" ]]; then
            echo "allow=true" >> "$GITHUB_OUTPUT"
            echo "Kernel guard override enabled by label: allow-kernel-change"
          else
            echo "allow=false" >> "$GITHUB_OUTPUT"
            echo "Kernel guard override label not present."
          fi

      - name: Run kernel guard (diff-based)
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.sha }}
          ALLOW_KERNEL_CHANGES: ${{ steps.labels.outputs.allow }}
        run: |
          set -euo pipefail
          git fetch --no-tags --prune --depth=1 origin \
            "refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          git show "origin/${BASE_REF}:tools/kernel_guard.py" \
            > "${RUNNER_TEMP}/kernel_guard.py"

          if [[ "${ALLOW_KERNEL_CHANGES}" == "true" ]]; then
            python "${RUNNER_TEMP}/kernel_guard.py" \
              --base-ref "origin/${BASE_REF}" \
              --head-ref "${HEAD_SHA}" \
              --allow-kernel-changes
          else
            python "${RUNNER_TEMP}/kernel_guard.py" \
              --base-ref "origin/${BASE_REF}" \
              --head-ref "${HEAD_SHA}"
          fi
