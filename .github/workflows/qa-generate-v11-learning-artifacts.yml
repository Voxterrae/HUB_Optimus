name: Generate exact v1.1 repository-learning artifacts

on:
  push:
    branches:
      - qa/1912-generate-learning-artifacts

permissions:
  contents: write
  issues: write

jobs:
  generate:
    name: generate-v11-learning-artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Record generation run
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          body = (
              "## Deterministic v1.1 repository learning publication started\n\n"
              f"- workflow source: `{os.environ['SOURCE_SHA']}`\n"
              f"- workflow run: {os.environ['RUN_URL']}\n"
              "- analyzed commit: `4a6201821bd1223a9dbd44b04a8c5e65eab4f787`\n"
              "- target Draft branch: `feat/obsidian-project-intelligence-v1.1`\n"
              "- output: `system.inventory.json` + `system.delta.json`\n"
              "- production deployment: none\n"
          )
          request = urllib.request.Request(
              "https://api.github.com/repos/Voxterrae/HUB_Optimus/issues/1912/comments",
              data=json.dumps({"body": body}).encode("utf-8"),
              method="POST",
              headers={
                  "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "Content-Type": "application/json",
              },
          )
          with urllib.request.urlopen(request, timeout=30):
              pass
          PY

      - name: Checkout exact v1.1 learner head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 4a6201821bd1223a9dbd44b04a8c5e65eab4f787
          fetch-depth: 0
          persist-credentials: true

      - name: Verify pinned source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "4a6201821bd1223a9dbd44b04a8c5e65eab4f787"
          test "$(git rev-parse 'HEAD^{tree}')" = "961463e2c8c68634b70bf3b029f6a42f975b2e70"
          remote_head="$(git ls-remote origin refs/heads/feat/obsidian-project-intelligence-v1.1 | cut -f1)"
          test "$remote_head" = "4a6201821bd1223a9dbd44b04a8c5e65eab4f787"

      - name: Generate deterministic inventory and delta
        shell: bash
        run: |
          set -euo pipefail
          python tools/project_intelligence/repository_intelligence.py \
            --root . \
            --current 4a6201821bd1223a9dbd44b04a8c5e65eab4f787
          python tools/project_intelligence/repository_intelligence.py \
            --root . \
            --current 4a6201821bd1223a9dbd44b04a8c5e65eab4f787 \
            --check

      - name: Validate generated contracts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          route = Path("site/obsidian-HUB_Optimus")
          inventory = json.loads((route / "system.inventory.json").read_text(encoding="utf-8"))
          delta = json.loads((route / "system.delta.json").read_text(encoding="utf-8"))

          assert inventory["schema_version"] == "hub-optimus-project-intelligence.inventory.v1.1"
          assert inventory["repository"]["commit"] == "4a6201821bd1223a9dbd44b04a8c5e65eab4f787"
          assert inventory["repository"]["tree"] == "961463e2c8c68634b70bf3b029f6a42f975b2e70"
          assert inventory["summary"]["tracked_files"] > 0
          assert inventory["summary"]["mapped_files"] > 0
          assert delta["schema_version"] == "hub-optimus-project-intelligence.delta.v1.1"
          assert delta["comparison"]["to_commit"] == inventory["repository"]["commit"]
          assert delta["summary"]["changed_paths"] > 0
          assert delta["review_boundary"]["automatic_fact_updates"] is False
          print(json.dumps({"inventory": inventory["summary"], "delta": delta["summary"]}, indent=2))
          PY

      - name: Commit generated artifacts to the exact Draft branch
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f \
            site/obsidian-HUB_Optimus/system.inventory.json \
            site/obsidian-HUB_Optimus/system.delta.json
          git commit -m "feat(project-intelligence): add deterministic inventory and delta"
          published_sha="$(git rev-parse HEAD)"
          published_tree="$(git rev-parse 'HEAD^{tree}')"
          git push \
            --force-with-lease=refs/heads/feat/obsidian-project-intelligence-v1.1:4a6201821bd1223a9dbd44b04a8c5e65eab4f787 \
            origin HEAD:refs/heads/feat/obsidian-project-intelligence-v1.1
          echo "sha=$published_sha" >> "$GITHUB_OUTPUT"
          echo "tree=$published_tree" >> "$GITHUB_OUTPUT"

      - name: Record publication result
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PUBLISHED_SHA: ${{ steps.publish.outputs.sha }}
          PUBLISHED_TREE: ${{ steps.publish.outputs.tree }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          body = (
              "## Deterministic v1.1 repository learning published\n\n"
              f"- workflow run: {os.environ['RUN_URL']}\n"
              f"- Draft head: `{os.environ['PUBLISHED_SHA']}`\n"
              f"- Draft tree: `{os.environ['PUBLISHED_TREE']}`\n"
              "- artifacts: `system.inventory.json`, `system.delta.json`\n"
              "- production deployment: none\n"
          )
          request = urllib.request.Request(
              "https://api.github.com/repos/Voxterrae/HUB_Optimus/issues/1912/comments",
              data=json.dumps({"body": body}).encode("utf-8"),
              method="POST",
              headers={
                  "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "Content-Type": "application/json",
              },
          )
          with urllib.request.urlopen(request, timeout=30):
              pass
          PY
