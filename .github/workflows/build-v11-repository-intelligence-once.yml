          # Model Delta and Drift

          ## Purpose

          `system.delta.json` compares a pinned semantic baseline with a reviewed implementation commit. It connects changed Git paths to current model source references and derives review scope from the typed relations already documented by [[Architecture Overview]].

          ## Active capabilities

          - deterministic added, modified, deleted and renamed path inventory;
          - changed-domain summary;
          - changed-path to model-object intersection;
          - stale-candidate register for source-bound objects;
          - direct, upstream and downstream graph impact derived from existing relations;
          - unmodelled architecture-relevant changes listed as review candidates.

          ## Partial boundary

          Detection is implemented. Automatic semantic-model mutation is not. A changed source path does not prove that the corresponding architectural fact changed, and the tool records `requires-review` rather than silently rewriting JSON or Obsidian notes.

          Incremental note and graph regeneration remains planned and must preserve the discrepancy history defined by [[Update Protocol]].

          ## External state

          Git deltas cannot certify mutable repository settings, production deployment, DNS, TLS, EC2 or Nginx. Those claims remain `UNKNOWN` unless directly inspected.

