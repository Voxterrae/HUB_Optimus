name: Build v1.1 deterministic repository intelligence once

on:
  push:
    branches:
      - automation/1912-deep-system-learning-v1

permissions:
  contents: write
  issues: write

concurrency:
  group: build-v11-repository-intelligence-once
  cancel-in-progress: false

jobs:
  build:
    name: build-v11-repository-intelligence
    if: github.repository == 'Voxterrae/HUB_Optimus'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Record build start
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          body = (
              "## Deep whole-system learning build started\n\n"
              f"- workflow source: `{os.environ['SOURCE_SHA']}`\n"
              f"- workflow run: {os.environ['RUN_URL']}\n"
              "- target branch: `feat/obsidian-project-intelligence-v1.1`\n"
              "- required starting head: `3f57ac105bb5251ed2204813b07a414067180eaa`\n"
              "- scope: deterministic Git inventory, model coverage, drift and commit delta\n"
              "- production deployment: none\n"
          )
          request = urllib.request.Request(
              "https://api.github.com/repos/Voxterrae/HUB_Optimus/issues/1912/comments",
              data=json.dumps({"body": body}).encode("utf-8"),
              method="POST",
              headers={
                  "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "Content-Type": "application/json",
              },
          )
          with urllib.request.urlopen(request, timeout=30):
              pass
          PY

      - name: Checkout exact v1.1 Draft branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/obsidian-project-intelligence-v1.1
          fetch-depth: 0
          persist-credentials: true

      - name: Verify starting identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "3f57ac105bb5251ed2204813b07a414067180eaa"
          test "$(git rev-parse 'HEAD^{tree}')" = "88f67c24a8384f85ff75dd04fc22acf438e56be8"
          test -z "$(git status --short)"

      - name: Write deterministic repository intelligence implementation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tools/project_intelligence tests \
            obsidian-HUB_Optimus/98_META site/obsidian-HUB_Optimus

          cat > tools/project_intelligence/__init__.py <<'PY'
          """Deterministic, evidence-bound repository intelligence tooling."""
          PY

          cat > tools/project_intelligence/repository_intelligence.py <<'PY'
          #!/usr/bin/env python3
          """Build deterministic repository inventory and model-delta artifacts.

          The tool reads Git objects and the reviewed Project Intelligence JSON model.
          It never edits architectural facts automatically. Outputs are review inputs,
          not truth adjudication, runtime telemetry, or evidence of mutable external state.
          """

          from __future__ import annotations

          import argparse
          import json
          import subprocess
          import sys
          from collections import Counter, defaultdict
          from pathlib import Path, PurePosixPath
          from typing import Any, Iterable


          ROOT = Path(__file__).resolve().parents[2]
          ROUTE = ROOT / "site" / "obsidian-HUB_Optimus"
          DEFAULT_MODEL = ROUTE / "system.json"
          DEFAULT_RUNTIME = ROUTE / "system.runtime.json"
          DEFAULT_INVENTORY = ROUTE / "system.inventory.json"
          DEFAULT_DELTA = ROUTE / "system.delta.json"
          REPOSITORY = "Voxterrae/HUB_Optimus"
          GENERATED_PATHS = {
              "site/obsidian-HUB_Optimus/system.inventory.json",
              "site/obsidian-HUB_Optimus/system.delta.json",
          }
          ARCHITECTURE_DOMAINS = {
              "project-intelligence",
              "governance",
              "governance-automation",
              "frontend",
              "semantic-engine",
              "simulation-runtime",
              "contracts",
              "methodology",
              "operations",
              "testing",
              "benchmarking",
              "tooling",
              "data",
          }
          ROOT_GOVERNANCE_FILES = {
              "AGENTS.md",
              "CONTRIBUTING.md",
              "INTEGRITY_SCORING_SYSTEM.md",
              "INTEGRITY_SCORING_SYSTEM_EN.md",
              "IP_NOTICE.md",
              "KERNEL_CHARTER.md",
              "KERNEL_CHARTER_EN.md",
              "SECURITY.md",
              "TECHNICAL_MANIFESTO.md",
          }


          class IntelligenceError(RuntimeError):
              """Raised when deterministic evidence cannot be collected."""


          def git(*arguments: str, binary: bool = False) -> str | bytes:
              completed = subprocess.run(
                  ["git", "-C", str(ROOT), *arguments],
                  check=False,
                  capture_output=True,
              )
              if completed.returncode != 0:
                  stderr = completed.stderr.decode("utf-8", errors="replace").strip()
                  raise IntelligenceError(
                      f"git {' '.join(arguments)} failed ({completed.returncode}): {stderr}"
                  )
              if binary:
                  return completed.stdout
              return completed.stdout.decode("utf-8", errors="strict").strip()


          def canonical_json(value: Any) -> str:
              return json.dumps(
                  value,
                  ensure_ascii=False,
                  sort_keys=True,
                  indent=2,
              ) + "\n"


          def write_json(path: Path, value: Any) -> None:
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(canonical_json(value), encoding="utf-8")


          def resolve_path(value: str | Path) -> Path:
              path = Path(value)
              return path if path.is_absolute() else ROOT / path


          def resolve_commit(ref: str) -> str:
              commit = str(git("rev-parse", "--verify", f"{ref}^{{commit}}"))
              if len(commit) != 40:
                  raise IntelligenceError(f"Unexpected commit identity for {ref!r}: {commit!r}")
              return commit


          def commit_tree(commit: str) -> str:
              tree = str(git("rev-parse", f"{commit}^{{tree}}"))
              if len(tree) != 40:
                  raise IntelligenceError(f"Unexpected tree identity for {commit!r}: {tree!r}")
              return tree


          def commit_time(commit: str) -> str:
              return str(git("show", "-s", "--format=%cI", commit))


          def normalize_repository_path(path: str) -> str:
              normalized = PurePosixPath(path.strip().strip("/")).as_posix()
              if normalized in {"", "."}:
                  raise IntelligenceError(f"Invalid empty repository path: {path!r}")
              if normalized.startswith("../") or "/../" in normalized:
                  raise IntelligenceError(f"Unsafe repository path: {path!r}")
              return normalized


          def classify_domain(path: str) -> str:
              if (
                  path.startswith("site/obsidian-HUB_Optimus/")
                  or path.startswith("obsidian-HUB_Optimus/")
                  or path.startswith("tools/project_intelligence/")
                  or path.startswith("tests/test_project_intelligence")
              ):
                  return "project-intelligence"
              if path.startswith(".github/workflows/") or path.startswith(".github/scripts/"):
                  return "governance-automation"
              if (
                  path.startswith("docs/governance/")
                  or path.startswith("config/governance/")
                  or path == ".github/CODEOWNERS"
                  or path in ROOT_GOVERNANCE_FILES
              ):
                  return "governance"
              if path.startswith("site/"):
                  return "frontend"
              if path.startswith("semantic_engine/"):
                  return "semantic-engine"
              if path.startswith("ops/"):
                  return "operations"
              if path.startswith("tests/"):
                  return "testing"
              if path.startswith("benchmarks/"):
                  return "benchmarking"
              if path.startswith("tools/"):
                  return "tooling"
              if path.startswith("datasets/") or path.startswith("data/"):
                  return "data"
              if path.startswith("v1_core/"):
                  return "methodology"
              if path.startswith("docs/"):
                  return "documentation"
              if path.endswith(".schema.json"):
                  return "contracts"
              if "/" not in path and path.endswith(".py"):
                  return "simulation-runtime"
              return "repository-support"


          def extension_for(path: str) -> str:
              name = PurePosixPath(path).name
              if name.endswith(".schema.json"):
                  return ".schema.json"
              suffix = PurePosixPath(path).suffix.lower()
              return suffix or "[none]"


          def list_tree(ref: str) -> list[dict[str, Any]]:
              raw = git("ls-tree", "-r", "-z", "--long", ref, binary=True)
              assert isinstance(raw, bytes)
              records: list[dict[str, Any]] = []
              for entry in raw.split(b"\0"):
                  if not entry:
                      continue
                  header, raw_path = entry.split(b"\t", 1)
                  mode, object_type, object_sha, raw_size = header.decode("ascii").split()
                  path = normalize_repository_path(raw_path.decode("utf-8"))
                  if object_type != "blob" or path in GENERATED_PATHS:
                      continue
                  size = 0 if raw_size == "-" else int(raw_size)
                  domain = classify_domain(path)
                  records.append(
                      {
                          "path": path,
                          "mode": mode,
                          "blob_sha": object_sha,
                          "size_bytes": size,
                          "extension": extension_for(path),
                          "domain": domain,
                          "architecture_relevant": domain in ARCHITECTURE_DOMAINS,
                          "domain_confidence": "INFERRED",
                      }
                  )
              records.sort(key=lambda item: item["path"])
              return records


          def load_model(model_path: Path, runtime_path: Path) -> dict[str, Any]:
              core = json.loads(model_path.read_text(encoding="utf-8"))
              runtime = json.loads(runtime_path.read_text(encoding="utf-8"))
              return {**core, **runtime}


          def model_objects(model: dict[str, Any]) -> list[dict[str, Any]]:
              result: list[dict[str, Any]] = []
              for section in (
                  "components",
                  "external_systems",
                  "dependencies",
                  "interfaces",
                  "entities",
                  "deployment",
              ):
                  for item in model.get(section, []):
                      item_id = str(item.get("id", "")).strip()
                      if not item_id:
                          continue
                      result.append(
                          {
                              "key": f"{section}:{item_id}",
                              "section": section,
                              "id": item_id,
                              "name": item.get("name", item_id),
                              "status": item.get("status", "unknown"),
                              "confidence": item.get("confidence", "UNKNOWN"),
                              "source": sorted(
                                  {
                                      normalize_repository_path(source)
                                      for source in item.get("source", [])
                                      if isinstance(source, str) and source.strip()
                                  }
                              ),
                          }
                      )
              result.sort(key=lambda item: item["key"])
              return result


          def files_for_reference(reference: str, file_paths: set[str]) -> tuple[str, list[str]]:
              if reference in file_paths:
                  return "exact", [reference]
              prefix = reference.rstrip("/") + "/"
              matches = sorted(path for path in file_paths if path.startswith(prefix))
              if matches:
                  return "prefix", matches
              return "unresolved", []


          def build_source_index(
              objects: list[dict[str, Any]],
              files: list[dict[str, Any]],
          ) -> tuple[list[dict[str, Any]], dict[str, set[str]], dict[str, set[str]]]:
              file_paths = {item["path"] for item in files}
              reference_to_objects: dict[str, set[str]] = defaultdict(set)
              for item in objects:
                  for reference in item["source"]:
                      reference_to_objects[reference].add(item["key"])

              file_to_objects: dict[str, set[str]] = defaultdict(set)
              source_records: list[dict[str, Any]] = []
              for reference in sorted(reference_to_objects):
                  match_type, matched_files = files_for_reference(reference, file_paths)
                  object_keys = sorted(reference_to_objects[reference])
                  for path in matched_files:
                      file_to_objects[path].update(object_keys)
                  source_records.append(
                      {
                          "path": reference,
                          "match_type": match_type,
                          "matched_files": matched_files,
                          "model_objects": object_keys,
                          "confidence": "CONFIRMED" if matched_files else "UNKNOWN",
                      }
                  )
              return source_records, file_to_objects, reference_to_objects


          def ratio(numerator: int, denominator: int) -> float:
              return round(numerator / denominator, 6) if denominator else 0.0


          def summarize_domains(files: list[dict[str, Any]]) -> list[dict[str, Any]]:
              buckets: dict[str, list[dict[str, Any]]] = defaultdict(list)
              for item in files:
                  buckets[item["domain"]].append(item)
              result = []
              for domain in sorted(buckets):
                  records = buckets[domain]
                  modeled = sum(bool(item.get("modeled_by")) for item in records)
                  result.append(
                      {
                          "domain": domain,
                          "files": len(records),
                          "bytes": sum(item["size_bytes"] for item in records),
                          "modeled_files": modeled,
                          "coverage_ratio": ratio(modeled, len(records)),
                          "architecture_relevant": domain in ARCHITECTURE_DOMAINS,
                          "classification_confidence": "INFERRED",
                      }
                  )
              return result


          def build_inventory(
              head_ref: str,
              model_path: Path,
              runtime_path: Path,
          ) -> tuple[dict[str, Any], dict[str, Any]]:
              head_commit = resolve_commit(head_ref)
              model = load_model(model_path, runtime_path)
              objects = model_objects(model)
              files = list_tree(head_commit)
              source_records, file_to_objects, reference_to_objects = build_source_index(objects, files)

              for item in files:
                  item["modeled_by"] = sorted(file_to_objects.get(item["path"], set()))

              modeled_files = [item for item in files if item["modeled_by"]]
              architecture_files = [item for item in files if item["architecture_relevant"]]
              modeled_architecture_files = [item for item in architecture_files if item["modeled_by"]]
              unresolved = [item for item in source_records if item["match_type"] == "unresolved"]
              unmodeled_candidates = [
                  {
                      "path": item["path"],
                      "domain": item["domain"],
                      "blob_sha": item["blob_sha"],
                      "reason": "Architecture-relevant Git file has no current model source reference.",
                      "confidence": "INFERRED",
                      "review_state": "candidate",
                  }
                  for item in architecture_files
                  if not item["modeled_by"]
              ]

              top_level = Counter(
                  path.split("/", 1)[0] if "/" in path else "[root]"
                  for path in (item["path"] for item in files)
              )
              extensions = Counter(item["extension"] for item in files)
              model_snapshot = {
                  "components": len(model.get("components", [])),
                  "interfaces": len(model.get("interfaces", [])),
                  "entities": len(model.get("entities", [])),
                  "relations": len(model.get("relations", [])),
                  "risks": len(model.get("risks", [])),
              }

              inventory = {
                  "schema_version": "hub-optimus-repository-inventory.v1.1",
                  "analysis": {
                      "repository": REPOSITORY,
                      "commit": head_commit,
                      "tree": commit_tree(head_commit),
                      "commit_time_utc": commit_time(head_commit),
                      "semantic_baseline_commit": model.get("analysis", {}).get("commit"),
                      "semantic_baseline_tree": model.get("analysis", {}).get("tree"),
                      "generator": "tools/project_intelligence/repository_intelligence.py",
                      "evidence_kind": "git-tree",
                      "confidence": "CONFIRMED",
                      "boundary": (
                          "Git inventory and model-reference coverage are confirmed for the pinned commit. "
                          "Domain classification and unmodeled-surface relevance are reviewable inferences. "
                          "Mutable external state remains UNKNOWN."
                      ),
                  },
                  "summary": {
                      "files": len(files),
                      "bytes": sum(item["size_bytes"] for item in files),
                      "directories": len(
                          {
                              str(PurePosixPath(item["path"]).parent)
                              for item in files
                              if str(PurePosixPath(item["path"]).parent) != "."
                          }
                      ),
                      "modeled_files": len(modeled_files),
                      "modeled_file_ratio": ratio(len(modeled_files), len(files)),
                      "architecture_files": len(architecture_files),
                      "modeled_architecture_files": len(modeled_architecture_files),
                      "architecture_coverage_ratio": ratio(
                          len(modeled_architecture_files), len(architecture_files)
                      ),
                      "source_references": len(source_records),
                      "resolved_source_references": len(source_records) - len(unresolved),
                      "unresolved_source_references": len(unresolved),
                      "unmodeled_architecture_candidates": len(unmodeled_candidates),
                  },
                  "model_snapshot": model_snapshot,
                  "domains": summarize_domains(files),
                  "top_level": [
                      {"name": name, "files": count}
                      for name, count in sorted(top_level.items())
                  ],
                  "extensions": [
                      {"extension": extension, "files": count}
                      for extension, count in sorted(extensions.items())
                  ],
                  "model_objects": objects,
                  "source_references": source_records,
                  "unresolved_source_references": unresolved,
                  "unmodeled_architecture_candidates": unmodeled_candidates,
                  "files": files,
                  "exclusions": sorted(GENERATED_PATHS),
                  "external_state": {
                      "status": "unknown",
                      "confidence": "UNKNOWN",
                      "objects": [
                          "repository rulesets",
                          "GitHub Pages runtime",
                          "DNS",
                          "TLS",
                          "EC2",
                          "Nginx",
                      ],
                      "reason": "A Git tree cannot certify mutable external state.",
                  },
              }
              context = {
                  "model": model,
                  "objects": objects,
                  "source_records": source_records,
                  "file_to_objects": file_to_objects,
                  "reference_to_objects": reference_to_objects,
                  "files": files,
              }
              return inventory, context


          def parse_diff(base_commit: str, head_commit: str) -> list[dict[str, Any]]:
              raw = git(
                  "diff",
                  "--name-status",
                  "-z",
                  f"{base_commit}..{head_commit}",
                  binary=True,
              )
              assert isinstance(raw, bytes)
              tokens = [token.decode("utf-8") for token in raw.split(b"\0") if token]
              changes: list[dict[str, Any]] = []
              index = 0
              while index < len(tokens):
                  status_token = tokens[index]
                  index += 1
                  code = status_token[0]
                  if code in {"R", "C"}:
                      old_path = normalize_repository_path(tokens[index])
                      new_path = normalize_repository_path(tokens[index + 1])
                      index += 2
                      path = new_path
                  else:
                      old_path = None
                      path = normalize_repository_path(tokens[index])
                      index += 1
                  changes.append(
                      {
                          "status": status_token,
                          "kind": {
                              "A": "added",
                              "M": "modified",
                              "D": "deleted",
                              "R": "renamed",
                              "C": "copied",
                              "T": "type-changed",
                          }.get(code, "other"),
                          "path": path,
                          "old_path": old_path,
                      }
                  )
              changes.sort(key=lambda item: (item["path"], item["status"]))
              return changes


          def object_keys_for_path(
              path: str,
              source_records: Iterable[dict[str, Any]],
          ) -> set[str]:
              result: set[str] = set()
              for record in source_records:
                  reference = record["path"].rstrip("/")
                  if path == reference or path.startswith(reference + "/"):
                      result.update(record["model_objects"])
              return result


          def graph_reachable(
              model: dict[str, Any],
              seeds: set[str],
              reverse: bool,
          ) -> set[str]:
              adjacency: dict[str, set[str]] = defaultdict(set)
              for relation in model.get("relations", []):
                  source = relation.get("to") if reverse else relation.get("from")
                  target = relation.get("from") if reverse else relation.get("to")
                  if isinstance(source, str) and isinstance(target, str):
                      adjacency[source].add(target)
              visited = set(seeds)
              queue = sorted(seeds)
              while queue:
                  current = queue.pop(0)
                  for target in sorted(adjacency.get(current, set())):
                      if target in visited:
                          continue
                      visited.add(target)
                      queue.append(target)
              return visited


          def build_delta(
              base_ref: str,
              head_ref: str,
              inventory: dict[str, Any],
              context: dict[str, Any],
          ) -> dict[str, Any]:
              base_commit = resolve_commit(base_ref)
              head_commit = inventory["analysis"]["commit"]
              files_by_path = {item["path"]: item for item in context["files"]}
              source_records = context["source_records"]
              object_lookup = {item["key"]: item for item in context["objects"]}
              changes = parse_diff(base_commit, head_commit)
              affected: dict[str, set[str]] = defaultdict(set)

              for change in changes:
                  path = change["path"]
                  object_keys = object_keys_for_path(path, source_records)
                  if change.get("old_path"):
                      object_keys.update(object_keys_for_path(change["old_path"], source_records))
                  for key in object_keys:
                      affected[key].add(path)
                  head_record = files_by_path.get(path)
                  change["domain"] = (
                      head_record["domain"] if head_record else classify_domain(path)
                  )
                  change["architecture_relevant"] = (
                      change["domain"] in ARCHITECTURE_DOMAINS
                  )
                  change["modeled_by"] = sorted(object_keys)
                  change["head_blob_sha"] = head_record["blob_sha"] if head_record else None
                  change["confidence"] = "CONFIRMED"

              affected_objects = []
              for key in sorted(affected):
                  metadata = object_lookup.get(key, {})
                  affected_objects.append(
                      {
                          "key": key,
                          "section": metadata.get("section"),
                          "id": metadata.get("id"),
                          "name": metadata.get("name", key),
                          "changed_paths": sorted(affected[key]),
                          "review_state": "requires-review",
                          "confidence": "CONFIRMED",
                      }
                  )

              node_sections = {"components", "external_systems", "dependencies"}
              seed_nodes = {
                  item["id"]
                  for item in affected_objects
                  if item.get("section") in node_sections and item.get("id")
              }
              direct = set(seed_nodes)
              for relation in context["model"].get("relations", []):
                  source = relation.get("from")
                  target = relation.get("to")
                  if source in seed_nodes and isinstance(target, str):
                      direct.add(target)
                  if target in seed_nodes and isinstance(source, str):
                      direct.add(source)
              upstream = graph_reachable(context["model"], seed_nodes, reverse=True)
              downstream = graph_reachable(context["model"], seed_nodes, reverse=False)

              kind_counts = Counter(change["kind"] for change in changes)
              domain_counts = Counter(change["domain"] for change in changes)
              changed_modeled = [change for change in changes if change["modeled_by"]]
              review_candidates = [
                  change
                  for change in changes
                  if change["architecture_relevant"] and not change["modeled_by"]
              ]

              return {
                  "schema_version": "hub-optimus-model-delta.v1.1",
                  "analysis": {
                      "repository": REPOSITORY,
                      "base_commit": base_commit,
                      "base_tree": commit_tree(base_commit),
                      "head_commit": head_commit,
                      "head_tree": inventory["analysis"]["tree"],
                      "head_commit_time_utc": inventory["analysis"]["commit_time_utc"],
                      "generator": "tools/project_intelligence/repository_intelligence.py",
                      "confidence": "CONFIRMED",
                      "boundary": (
                          "Changed paths and source-reference intersections are deterministic. "
                          "Affected facts are review candidates; the tool never mutates the semantic model."
                      ),
                  },
                  "summary": {
                      "changed_paths": len(changes),
                      "added": kind_counts["added"],
                      "modified": kind_counts["modified"],
                      "deleted": kind_counts["deleted"],
                      "renamed": kind_counts["renamed"],
                      "changed_modeled_paths": len(changed_modeled),
                      "unmodeled_architecture_review_candidates": len(review_candidates),
                      "affected_model_objects": len(affected_objects),
                      "seed_graph_nodes": len(seed_nodes),
                      "review_required": bool(affected_objects or review_candidates),
                  },
                  "domains": [
                      {"domain": domain, "changed_paths": count}
                      for domain, count in sorted(domain_counts.items())
                  ],
                  "affected_model_objects": affected_objects,
                  "graph_impact": {
                      "seed_nodes": sorted(seed_nodes),
                      "direct": sorted(direct),
                      "upstream": sorted(upstream),
                      "downstream": sorted(downstream),
                      "confidence": "INFERRED",
                      "reason": "Reachability is derived only from existing typed model relations.",
                  },
                  "stale_candidates": [
                      {
                          "model_object": item["key"],
                          "name": item["name"],
                          "changed_paths": item["changed_paths"],
                          "status": "candidate",
                          "confidence": "INFERRED",
                          "reason": "At least one source-bound path changed after the semantic baseline.",
                      }
                      for item in affected_objects
                  ],
                  "unmodeled_architecture_review_candidates": review_candidates,
                  "changes": changes,
                  "model_mutation": {
                      "status": "not-performed",
                      "confidence": "CONFIRMED",
                      "reason": "Human review is required before any Project Intelligence fact changes.",
                  },
                  "external_state": {
                      "status": "unknown",
                      "confidence": "UNKNOWN",
                      "reason": "Git delta cannot certify mutable deployment or infrastructure state.",
                  },
              }


          def create_artifacts(
              base_ref: str,
              head_ref: str,
              model_path: Path,
              runtime_path: Path,
          ) -> tuple[dict[str, Any], dict[str, Any]]:
              inventory, context = build_inventory(head_ref, model_path, runtime_path)
              delta = build_delta(base_ref, head_ref, inventory, context)
              return inventory, delta


          def add_common_arguments(parser: argparse.ArgumentParser) -> None:
              parser.add_argument("--base", required=True, help="Semantic baseline Git ref")
              parser.add_argument("--head", default="HEAD", help="Inventory target Git ref")
              parser.add_argument("--model", default=str(DEFAULT_MODEL.relative_to(ROOT)))
              parser.add_argument("--runtime", default=str(DEFAULT_RUNTIME.relative_to(ROOT)))
              parser.add_argument(
                  "--inventory-output",
                  default=str(DEFAULT_INVENTORY.relative_to(ROOT)),
              )
              parser.add_argument(
                  "--delta-output",
                  default=str(DEFAULT_DELTA.relative_to(ROOT)),
              )


          def main(argv: list[str] | None = None) -> int:
              parser = argparse.ArgumentParser(description=__doc__)
              commands = parser.add_subparsers(dest="command", required=True)
              build_parser = commands.add_parser("build", help="Write deterministic artifacts")
              check_parser = commands.add_parser("check", help="Verify committed artifacts")
              add_common_arguments(build_parser)
              add_common_arguments(check_parser)
              args = parser.parse_args(argv)

              model_path = resolve_path(args.model)
              runtime_path = resolve_path(args.runtime)
              inventory_output = resolve_path(args.inventory_output)
              delta_output = resolve_path(args.delta_output)
              inventory, delta = create_artifacts(
                  args.base,
                  args.head,
                  model_path,
                  runtime_path,
              )

              if args.command == "build":
                  write_json(inventory_output, inventory)
                  write_json(delta_output, delta)
                  print(
                      canonical_json(
                          {
                              "inventory_commit": inventory["analysis"]["commit"],
                              "inventory_tree": inventory["analysis"]["tree"],
                              "files": inventory["summary"]["files"],
                              "modeled_files": inventory["summary"]["modeled_files"],
                              "changed_paths": delta["summary"]["changed_paths"],
                              "affected_model_objects": delta["summary"]["affected_model_objects"],
                          }
                      ).strip()
                  )
                  return 0

              expected_inventory = json.loads(inventory_output.read_text(encoding="utf-8"))
              expected_delta = json.loads(delta_output.read_text(encoding="utf-8"))
              failures = []
              if expected_inventory != inventory:
                  failures.append(str(inventory_output.relative_to(ROOT)))
              if expected_delta != delta:
                  failures.append(str(delta_output.relative_to(ROOT)))
              if failures:
                  print("Stale deterministic artifacts: " + ", ".join(failures), file=sys.stderr)
                  return 1
              print("Repository intelligence artifacts are deterministic and current.")
              return 0


          if __name__ == "__main__":
              raise SystemExit(main())
