          # Deterministic Repository Inventory

          ## Purpose

          v1.1 inventories the complete Git tree of a pinned commit and maps existing Project Intelligence source references onto real files. It is a deterministic evidence collector for [[Whole-System Learning]], not an autonomous architecture judge.

          ## Confirmed output

          `system.inventory.json` records:

          - exact commit, tree and commit timestamp;
          - every non-generated Git blob, mode, object identity and byte size;
          - deterministic top-level, extension and domain summaries;
          - exact or prefix resolution of model source references;
          - source-to-model-object links;
          - domain-level coverage;
          - architecture-relevant files without a current source reference as review candidates.

          ## Epistemic boundary

          File existence, Git identity and source-reference matches are `CONFIRMED` for the pinned commit. Domain classification and architectural relevance are `INFERRED`. Rulesets, Pages runtime, DNS, TLS, EC2 and Nginx remain `UNKNOWN` until directly inspected.

          An unmodelled candidate is not automatically a missing component. It is a prompt for human review.

          ## Deterministic regeneration

          ```text
          python tools/project_intelligence/repository_intelligence.py build \
            --base 30e985226347b4bc59b0e187b96633a09647ca42 \
            --head <reviewed-implementation-commit>
          ```

          The generated inventory and delta files are excluded from their own inventory to avoid self-reference. The committed snapshots identify the exact implementation commit from which they were generated.

          ## Related

          - [[Repository Coverage]]
          - [[Model Delta and Drift]]
          - [[Source Map]]
          - [[Evidence Index]]
          - [[Update Protocol]]
