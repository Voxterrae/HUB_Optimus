name: Package exact v1.1 browser QA artifact

on:
  push:
    branches:
      - qa/1912-v11-browser-artifact

permissions:
  contents: read
  issues: write

jobs:
  package:
    name: package-v11-browser-artifact
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Record QA package run
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          body = (
              "## Corrected v1.1 browser artifact packaging started\n\n"
              f"- workflow source: `{os.environ['SOURCE_SHA']}`\n"
              f"- workflow run: {os.environ['RUN_URL']}\n"
              "- exact Draft head: `3f57ac105bb5251ed2204813b07a414067180eaa`\n"
              "- exact tree: `88f67c24a8384f85ff75dd04fc22acf438e56be8`\n"
              "- artifact: `v11-browser-surface-mobile-safe`\n"
          )
          request = urllib.request.Request(
              "https://api.github.com/repos/Voxterrae/HUB_Optimus/issues/1912/comments",
              data=json.dumps({"body": body}).encode("utf-8"),
              method="POST",
              headers={
                  "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "Content-Type": "application/json",
              },
          )
          with urllib.request.urlopen(request, timeout=30):
              pass
          PY

      - name: Checkout exact corrected v1.1 Draft head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 3f57ac105bb5251ed2204813b07a414067180eaa
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact artifact identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "3f57ac105bb5251ed2204813b07a414067180eaa"
          test "$(git rev-parse 'HEAD^{tree}')" = "88f67c24a8384f85ff75dd04fc22acf438e56be8"
          test -f site/obsidian-HUB_Optimus/index.html
          test -f site/obsidian-HUB_Optimus/app-v11.js
          test -f site/obsidian-HUB_Optimus/styles-v11.css
          test -f site/obsidian-HUB_Optimus/system.learning.json
          grep -Fq 'min-width: 0' site/obsidian-HUB_Optimus/styles-v11.css
          python -m json.tool site/obsidian-HUB_Optimus/system.learning.json >/dev/null
          node --check site/obsidian-HUB_Optimus/app-v11.js

      - name: Upload exact corrected browser surface
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          name: v11-browser-surface-mobile-safe
          path: site/obsidian-HUB_Optimus
