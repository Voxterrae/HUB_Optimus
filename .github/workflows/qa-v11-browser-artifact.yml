name: Package exact v1.1 browser QA artifact

on:
  push:
    branches:
      - qa/1912-v11-browser-artifact

permissions:
  contents: read
  issues: write

jobs:
  package:
    name: package-v11-browser-artifact
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Record QA package run
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          body = (
              "## v1.1 exact browser artifact packaging started\n\n"
              f"- workflow source: `{os.environ['SOURCE_SHA']}`\n"
              f"- workflow run: {os.environ['RUN_URL']}\n"
              "- exact Draft head: `f9ce7978cdc38a05aa08c90a996cdab790589248`\n"
              "- artifact: `v11-browser-surface`\n"
          )
          request = urllib.request.Request(
              "https://api.github.com/repos/Voxterrae/HUB_Optimus/issues/1912/comments",
              data=json.dumps({"body": body}).encode("utf-8"),
              method="POST",
              headers={
                  "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "Content-Type": "application/json",
              },
          )
          with urllib.request.urlopen(request, timeout=30):
              pass
          PY

      - name: Checkout exact v1.1 Draft head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: f9ce7978cdc38a05aa08c90a996cdab790589248
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact artifact identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "f9ce7978cdc38a05aa08c90a996cdab790589248"
          test "$(git rev-parse 'HEAD^{tree}')" = "8825e680e00670050a285e3cee40a37a6af65fa2"
          test -f site/obsidian-HUB_Optimus/index.html
          test -f site/obsidian-HUB_Optimus/app-v11.js
          test -f site/obsidian-HUB_Optimus/styles-v11.css
          test -f site/obsidian-HUB_Optimus/system.learning.json

      - name: Upload exact browser surface
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          name: v11-browser-surface
          path: site/obsidian-HUB_Optimus
