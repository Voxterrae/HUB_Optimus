name: Verify Obsidian Project Intelligence production routes

on:
  push:
    branches:
      - verify/1903-obsidian-production

permissions:
  contents: read
  issues: write

jobs:
  verify:
    name: verify-obsidian-production
    if: github.repository == 'Voxterrae/HUB_Optimus'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Record production verification start
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          body = (
              "## Obsidian production verification started\n\n"
              f"- verification source: `{os.environ['SOURCE_SHA']}`\n"
              f"- workflow run: {os.environ['RUN_URL']}\n"
              "- routes: `/`, `/operator/`, `/obsidian-HUB_Optimus/`\n"
          )
          request = urllib.request.Request(
              "https://api.github.com/repos/Voxterrae/HUB_Optimus/issues/1901/comments",
              data=json.dumps({"body": body}).encode("utf-8"),
              method="POST",
              headers={
                  "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "Content-Type": "application/json",
              },
          )
          with urllib.request.urlopen(request, timeout=30):
              pass
          PY

      - name: Verify live HTTP routes, assets and model
        id: routes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/obsidian-production"
          cd "$RUNNER_TEMP/obsidian-production"

          fetch() {
            local url="$1"
            local output="$2"
            local label="$3"
            local code=""
            for attempt in $(seq 1 15); do
              code="$(curl --location --silent --show-error \
                --connect-timeout 15 --max-time 45 \
                --output "$output" --write-out '%{http_code}' \
                "$url" || true)"
              if [ "$code" = "200" ]; then
                printf '%s HTTP %s\n' "$label" "$code"
                return 0
              fi
              printf '%s attempt %s returned HTTP %s\n' "$label" "$attempt" "${code:-curl-error}"
              sleep 3
            done
            printf '%s failed after retries\n' "$label" >&2
            return 1
          }

          fetch "https://huboptimus.dev/?verify=9c7b5d81" root.html root
          fetch "https://huboptimus.dev/operator/?verify=9c7b5d81" operator.html operator
          fetch "https://huboptimus.dev/obsidian-HUB_Optimus/?verify=9c7b5d81" obsidian.html obsidian
          fetch "https://huboptimus.dev/obsidian-HUB_Optimus/system.json?verify=9c7b5d81" system.json system-json
          fetch "https://huboptimus.dev/obsidian-HUB_Optimus/system.runtime.json?verify=9c7b5d81" system.runtime.json runtime-json
          fetch "https://huboptimus.dev/obsidian-HUB_Optimus/styles.css?verify=9c7b5d81" styles.css styles
          fetch "https://huboptimus.dev/obsidian-HUB_Optimus/styles-explorer.css?verify=9c7b5d81" styles-explorer.css explorer-styles
          fetch "https://huboptimus.dev/obsidian-HUB_Optimus/styles-content.css?verify=9c7b5d81" styles-content.css content-styles
          fetch "https://huboptimus.dev/obsidian-HUB_Optimus/app.js?verify=9c7b5d81" app.js app-js
          fetch "https://huboptimus.dev/obsidian-HUB_Optimus/app-graph.js?verify=9c7b5d81" app-graph.js graph-js

          grep -Fq '<title>HUB_Optimus' root.html
          grep -Fq 'HUB_Optimus Operator' operator.html
          grep -Fq '<title>HUB_Optimus · Project Intelligence</title>' obsidian.html
          grep -Fq 'El sistema puede' obsidian.html
          grep -Fq './system.json' obsidian.html
          grep -Fq './app-graph.js' obsidian.html
          grep -Fq './app.js' obsidian.html
          grep -Fq '30e985226347b4bc59b0e187b96633a09647ca42' obsidian.html

          python - <<'PY'
          import json
          from pathlib import Path

          system = json.loads(Path('system.json').read_text(encoding='utf-8'))
          runtime = json.loads(Path('system.runtime.json').read_text(encoding='utf-8'))
          assert system.get('project', {}).get('repository') == 'Voxterrae/HUB_Optimus'
          assert len(system.get('components', [])) == 16
          assert len(system.get('interfaces', [])) == 7
          assert len(system.get('entities', [])) == 13
          assert len(system.get('relations', [])) == 25
          assert runtime
          print('system-model counts: components=16 interfaces=7 entities=13 relations=25')
          PY

          node --check app.js
          node --check app-graph.js
          test -s styles.css
          test -s styles-explorer.css
          test -s styles-content.css

          {
            echo 'root=200'
            echo 'operator=200'
            echo 'obsidian=200'
            echo 'system_json=200'
            echo 'runtime_json=200'
            echo 'css_assets=200'
            echo 'javascript_assets=200'
            echo 'javascript_syntax=pass'
            echo 'model_counts=16/7/13/25'
          } | tee verification.txt

      - name: Record production verification result
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SOURCE_SHA: ${{ github.sha }}
          ROUTES_OUTCOME: ${{ steps.routes.outcome }}
        run: |
          python - <<'PY'
          import json
          import os
          import pathlib
          import urllib.request

          path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'obsidian-production' / 'verification.txt'
          evidence = path.read_text(encoding='utf-8', errors='replace') if path.exists() else '[verification evidence unavailable]'
          outcome = os.environ.get('ROUTES_OUTCOME', '')
          body = (
              "## Obsidian production verification result\n\n"
              f"- verification source: `{os.environ['SOURCE_SHA']}`\n"
              f"- workflow run: {os.environ['RUN_URL']}\n"
              f"- route and asset verification: `{outcome}`\n"
              "- public route: https://huboptimus.dev/obsidian-HUB_Optimus/\n"
              "- existing root: https://huboptimus.dev/\n"
              "- existing Operator: https://huboptimus.dev/operator/\n\n"
              "```text\n"
              f"{evidence}\n"
              "```\n"
          )
          request = urllib.request.Request(
              "https://api.github.com/repos/Voxterrae/HUB_Optimus/issues/1901/comments",
              data=json.dumps({"body": body}).encode('utf-8'),
              method='POST',
              headers={
                  'Authorization': f"Bearer {os.environ['GITHUB_TOKEN']}",
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'Content-Type': 'application/json',
              },
          )
          with urllib.request.urlopen(request, timeout=30):
              pass
          PY
