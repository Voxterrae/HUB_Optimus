name: Verify Obsidian Project Intelligence production routes

on:
  push:
    branches:
      - verify/1903-obsidian-production

permissions:
  contents: read
  issues: write

jobs:
  verify:
    name: verify-obsidian-production
    if: github.repository == 'Voxterrae/HUB_Optimus'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Record production verification start
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          body = (
              "## Obsidian production verification started\n\n"
              f"- verification source: `{os.environ['SOURCE_SHA']}`\n"
              f"- workflow run: {os.environ['RUN_URL']}\n"
              "- routes: `/`, `/operator/`, `/obsidian-HUB_Optimus/`\n"
              "- expected artifact: `9c7b5d81b2cf85d349b1ca141d559a75067a9b14`\n"
          )
          request = urllib.request.Request(
              "https://api.github.com/repos/Voxterrae/HUB_Optimus/issues/1901/comments",
              data=json.dumps({"body": body}).encode("utf-8"),
              method="POST",
              headers={
                  "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "Content-Type": "application/json",
              },
          )
          with urllib.request.urlopen(request, timeout=30):
              pass
          PY

      - name: Checkout exact reviewed artifact for byte comparison
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 9c7b5d81b2cf85d349b1ca141d559a75067a9b14
          fetch-depth: 1
          persist-credentials: false

      - name: Verify live HTTP routes, assets, bytes and model
        id: routes
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/obsidian-production"
          mkdir -p "$work"
          : > "$work/verification.txt"
          cd "$work"

          fetch() {
            local url="$1"
            local output="$2"
            local label="$3"
            local code=""
            for attempt in $(seq 1 15); do
              code="$(curl --location --silent --show-error \
                --connect-timeout 15 --max-time 45 \
                --output "$output" --write-out '%{http_code}' \
                "$url" || true)"
              if [ "$code" = "200" ]; then
                printf '%s=200\n' "$label" | tee -a verification.txt
                return 0
              fi
              printf '%s attempt %s returned HTTP %s\n' "$label" "$attempt" "${code:-curl-error}" | tee -a verification.txt
              sleep 3
            done
            printf '%s=failed\n' "$label" | tee -a verification.txt >&2
            return 1
          }

          fetch "https://huboptimus.dev/?verify=9c7b5d81" root.html root
          fetch "https://huboptimus.dev/operator/?verify=9c7b5d81" operator.html operator
          fetch "https://huboptimus.dev/obsidian-HUB_Optimus/?verify=9c7b5d81" obsidian.html obsidian
          fetch "https://huboptimus.dev/obsidian-HUB_Optimus/system.json?verify=9c7b5d81" system.json system_json
          fetch "https://huboptimus.dev/obsidian-HUB_Optimus/system.runtime.json?verify=9c7b5d81" system.runtime.json runtime_json
          fetch "https://huboptimus.dev/obsidian-HUB_Optimus/styles.css?verify=9c7b5d81" styles.css styles_css
          fetch "https://huboptimus.dev/obsidian-HUB_Optimus/styles-explorer.css?verify=9c7b5d81" styles-explorer.css explorer_css
          fetch "https://huboptimus.dev/obsidian-HUB_Optimus/styles-content.css?verify=9c7b5d81" styles-content.css content_css
          fetch "https://huboptimus.dev/obsidian-HUB_Optimus/app.js?verify=9c7b5d81" app.js app_js
          fetch "https://huboptimus.dev/obsidian-HUB_Optimus/app-graph.js?verify=9c7b5d81" app-graph.js graph_js

          grep -Fq '<title>HUB_Optimus' root.html
          grep -Fq 'HUB_Optimus Operator' operator.html
          grep -Fq '<title>HUB_Optimus · Project Intelligence</title>' obsidian.html
          grep -Fq 'El sistema puede' obsidian.html
          grep -Fq './system.json' obsidian.html
          grep -Fq './app-graph.js' obsidian.html
          grep -Fq './app.js' obsidian.html
          grep -Fq '30e985226347b4bc59b0e187b96633a09647ca42' obsidian.html
          echo 'html_contract=pass' | tee -a verification.txt

          cmp root.html "$GITHUB_WORKSPACE/site/index.html"
          cmp operator.html "$GITHUB_WORKSPACE/site/operator/index.html"
          cmp obsidian.html "$GITHUB_WORKSPACE/site/obsidian-HUB_Optimus/index.html"
          cmp system.json "$GITHUB_WORKSPACE/site/obsidian-HUB_Optimus/system.json"
          cmp system.runtime.json "$GITHUB_WORKSPACE/site/obsidian-HUB_Optimus/system.runtime.json"
          cmp styles.css "$GITHUB_WORKSPACE/site/obsidian-HUB_Optimus/styles.css"
          cmp styles-explorer.css "$GITHUB_WORKSPACE/site/obsidian-HUB_Optimus/styles-explorer.css"
          cmp styles-content.css "$GITHUB_WORKSPACE/site/obsidian-HUB_Optimus/styles-content.css"
          cmp app.js "$GITHUB_WORKSPACE/site/obsidian-HUB_Optimus/app.js"
          cmp app-graph.js "$GITHUB_WORKSPACE/site/obsidian-HUB_Optimus/app-graph.js"
          echo 'served_bytes_match_exact_commit=pass' | tee -a verification.txt

          python - <<'PY'
          import json
          from pathlib import Path

          system = json.loads(Path('system.json').read_text(encoding='utf-8'))
          runtime = json.loads(Path('system.runtime.json').read_text(encoding='utf-8'))
          assert system.get('analysis', {}).get('repository') == 'Voxterrae/HUB_Optimus'
          assert system.get('analysis', {}).get('commit') == '30e985226347b4bc59b0e187b96633a09647ca42'
          assert len(system.get('components', [])) == 16
          assert len(runtime.get('interfaces', [])) == 7
          assert len(runtime.get('entities', [])) == 13
          assert len(system.get('relations', [])) == 25
          assert len(runtime.get('risks', [])) == 8
          routes = runtime.get('deployment', [])[0].get('routes', [])
          assert routes == ['/', '/operator/', '/obsidian-HUB_Optimus/']
          print('model_counts=16/7/13/25')
          print('risks=8')
          print('declared_routes=/,/operator/,/obsidian-HUB_Optimus/')
          PY
          echo 'model_contract=pass' | tee -a verification.txt
          echo 'model_counts=16/7/13/25' | tee -a verification.txt
          echo 'risks=8' | tee -a verification.txt

          node --check app.js
          node --check app-graph.js
          test -s styles.css
          test -s styles-explorer.css
          test -s styles-content.css
          echo 'javascript_syntax=pass' | tee -a verification.txt
          echo 'css_assets_nonempty=pass' | tee -a verification.txt
          echo 'production_verification=pass' | tee -a verification.txt

      - name: Record production verification result
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SOURCE_SHA: ${{ github.sha }}
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          ROUTES_OUTCOME: ${{ steps.routes.outcome }}
        run: |
          python - <<'PY'
          import json
          import os
          import pathlib
          import urllib.request

          path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'obsidian-production' / 'verification.txt'
          evidence = path.read_text(encoding='utf-8', errors='replace') if path.exists() else '[verification evidence unavailable]'
          body = (
              "## Obsidian production verification result\n\n"
              f"- verification source: `{os.environ['SOURCE_SHA']}`\n"
              f"- workflow run: {os.environ['RUN_URL']}\n"
              f"- exact artifact checkout: `{os.environ.get('CHECKOUT_OUTCOME', '')}`\n"
              f"- route, byte and asset verification: `{os.environ.get('ROUTES_OUTCOME', '')}`\n"
              "- public route: https://huboptimus.dev/obsidian-HUB_Optimus/\n"
              "- existing root: https://huboptimus.dev/\n"
              "- existing Operator: https://huboptimus.dev/operator/\n"
              "- expected artifact: `9c7b5d81b2cf85d349b1ca141d559a75067a9b14`\n\n"
              "```text\n"
              f"{evidence}\n"
              "```\n"
          )
          request = urllib.request.Request(
              "https://api.github.com/repos/Voxterrae/HUB_Optimus/issues/1901/comments",
              data=json.dumps({"body": body}).encode('utf-8'),
              method='POST',
              headers={
                  'Authorization': f"Bearer {os.environ['GITHUB_TOKEN']}",
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'Content-Type': 'application/json',
              },
          )
          with urllib.request.urlopen(request, timeout=30):
              pass
          PY
