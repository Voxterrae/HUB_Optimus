name: Founder Authority Guard

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: founder-authority-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  founder-authority:
    name: founder-authority
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout trusted base policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Collect immutable GitHub evidence
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          from __future__ import annotations

          import json
          import os
          import pathlib
          import urllib.request

          event_path = pathlib.Path(os.environ["GITHUB_EVENT_PATH"])
          event = json.loads(event_path.read_text(encoding="utf-8"))
          pull = event.get("pull_request")
          repository = event.get("repository")
          if not isinstance(pull, dict) or not isinstance(repository, dict):
              raise SystemExit("pull_request and repository payloads are required")

          token = os.environ.get("GITHUB_TOKEN", "")
          if not token:
              raise SystemExit("GITHUB_TOKEN is required")

          api_url = os.environ.get("GITHUB_API_URL", "https://api.github.com").rstrip("/")
          full_name = repository.get("full_name")
          pull_number = pull.get("number")
          if not isinstance(full_name, str) or not full_name:
              raise SystemExit("repository.full_name is required")
          if not isinstance(pull_number, int) or pull_number <= 0:
              raise SystemExit("pull_request.number must be a positive integer")

          def api_get(path: str):
              request = urllib.request.Request(
                  f"{api_url}/repos/{full_name}/{path}",
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)

          def paginated(path: str) -> list[dict]:
              result: list[dict] = []
              page = 1
              while True:
                  separator = "&" if "?" in path else "?"
                  batch = api_get(f"{path}{separator}per_page=100&page={page}")
                  if not isinstance(batch, list):
                      raise SystemExit(f"GitHub API path {path!r} did not return an array")
                  result.extend(item for item in batch if isinstance(item, dict))
                  if len(batch) < 100:
                      return result
                  page += 1

          files = paginated(f"pulls/{pull_number}/files")
          reviews = paginated(f"pulls/{pull_number}/reviews")
          commits = paginated(f"pulls/{pull_number}/commits")

          owner = repository.get("owner") or {}
          author = pull.get("user") or {}
          base = pull.get("base") or {}
          head = pull.get("head") or {}

          evidence = {
              "repository": {
                  "full_name": full_name,
                  "id": repository.get("id"),
                  "owner": {
                      "login": owner.get("login"),
                      "id": owner.get("id"),
                  },
              },
              "pull_request": {
                  "number": pull_number,
                  "author": {
                      "login": author.get("login"),
                      "id": author.get("id"),
                  },
                  "body": pull.get("body") or "",
                  "head_sha": head.get("sha"),
                  "head_ref": head.get("ref"),
                  "base_ref": base.get("ref"),
              },
              "changed_files": [item.get("filename") for item in files],
              "reviews": [
                  {
                      "user": {
                          "login": (item.get("user") or {}).get("login"),
                          "id": (item.get("user") or {}).get("id"),
                      },
                      "state": item.get("state"),
                      "commit_id": item.get("commit_id"),
                      "submitted_at": item.get("submitted_at"),
                  }
                  for item in reviews
              ],
              "commits": [
                  {
                      "sha": item.get("sha"),
                      "verification": (item.get("commit") or {}).get("verification")
                      or {"verified": False, "reason": "missing_verification"},
                      "author": {
                          "login": (item.get("author") or {}).get("login"),
                          "id": (item.get("author") or {}).get("id"),
                      }
                      if item.get("author")
                      else None,
                      "committer": {
                          "login": (item.get("committer") or {}).get("login"),
                          "id": (item.get("committer") or {}).get("id"),
                      }
                      if item.get("committer")
                      else None,
                  }
                  for item in commits
              ],
          }

          output = pathlib.Path("founder-authority-evidence.json")
          output.write_text(
              json.dumps(evidence, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )
          output.chmod(0o600)
          PY

      - name: Validate founder authority and anti-impersonation boundary
        run: |
          python - <<'PY'
          from __future__ import annotations

          import json
          import pathlib
          import re
          import sys

          ISSUE_REFERENCE_RE = re.compile(
              r"(?im)^\s*(?:related\s+to|governance\s+issue)\s+#(?P<number>[1-9][0-9]*)\b"
          )
          PROTECTED_PREFIXES = ("docs/governance/", "config/governance/", ".github/")
          PROTECTED_EXACT_PATHS = {
              "AGENTS.md",
              "ACKNOWLEDGEMENTS.md",
              "CONTRIBUTING.md",
              "IP_NOTICE.md",
              "KERNEL_CHARTER.md",
              "KERNEL_CHARTER_EN.md",
              "README.md",
              "docs/context/OWNER_AUTHORITY_HANDOFF.md",
              "docs/context/SOURCE_OF_TRUTH.md",
              "tools/founder_authority_guard.py",
              "tests/test_founder_authority_guard.py",
          }

          class GuardError(RuntimeError):
              pass

          def require_mapping(value, label):
              if not isinstance(value, dict):
                  raise GuardError(f"{label} must be an object")
              return value

          def require_list(value, label):
              if not isinstance(value, list):
                  raise GuardError(f"{label} must be an array")
              return value

          def require_string(value, label):
              if not isinstance(value, str) or not value.strip():
                  raise GuardError(f"{label} must be a non-empty string")
              return value.strip()

          def require_int(value, label):
              if isinstance(value, bool) or not isinstance(value, int) or value <= 0:
                  raise GuardError(f"{label} must be a positive integer")
              return value

          def normalize_path(value):
              path = require_string(value, "changed file path").replace("\\", "/")
              pure = pathlib.PurePosixPath(path)
              if pure.is_absolute() or ".." in pure.parts or path.startswith("./"):
                  raise GuardError(f"unsafe changed file path: {path!r}")
              normalized = pure.as_posix()
              if normalized in {"", "."}:
                  raise GuardError("changed file path cannot be empty")
              return normalized

          def identity_matches(candidate, owner_login, owner_id):
              candidate = require_mapping(candidate, "GitHub identity")
              return candidate.get("login") == owner_login and candidate.get("id") == owner_id

          def latest_owner_review(reviews, owner_login, owner_id):
              latest = None
              for raw in reviews:
                  review = require_mapping(raw, "review")
                  user = review.get("user")
                  if not isinstance(user, dict) or not identity_matches(user, owner_login, owner_id):
                      continue
                  latest = review
              return latest

          def validate_verified_commits(commits):
              if not commits:
                  raise GuardError("pull request evidence contains no commits")
              failures = []
              for raw in commits:
                  commit = require_mapping(raw, "commit")
                  sha = require_string(commit.get("sha"), "commit SHA")
                  verification = require_mapping(commit.get("verification"), "verification")
                  if verification.get("verified") is not True:
                      reason = verification.get("reason") or "unverified"
                      failures.append(f"{sha[:12]} ({reason})")
              if failures:
                  raise GuardError(
                      "all commits must be verified; failing commits: " + ", ".join(failures)
                  )

          try:
              manifest = json.loads(
                  pathlib.Path("config/governance/owner_identity.v1.json").read_text(encoding="utf-8")
              )
              evidence = json.loads(
                  pathlib.Path("founder-authority-evidence.json").read_text(encoding="utf-8")
              )

              manifest = require_mapping(manifest, "owner identity manifest")
              repository_identity = require_mapping(
                  manifest.get("repository_identity"), "repository_identity"
              )
              owner_login = require_string(repository_identity.get("login"), "repository login")
              owner_id = require_int(repository_identity.get("immutable_user_id"), "repository user ID")

              repository = require_mapping(evidence.get("repository"), "repository")
              repository_owner = require_mapping(repository.get("owner"), "repository owner")
              if not identity_matches(repository_owner, owner_login, owner_id):
                  raise GuardError(
                      "repository owner identity does not match the pinned login and immutable user ID"
                  )

              pull_request = require_mapping(evidence.get("pull_request"), "pull_request")
              author = require_mapping(pull_request.get("author"), "pull request author")
              head_sha = require_string(pull_request.get("head_sha"), "head SHA")
              base_ref = require_string(pull_request.get("base_ref"), "base ref")
              body = pull_request.get("body")
              if body is None:
                  body = ""
              if not isinstance(body, str):
                  raise GuardError("pull request body must be a string")
              if base_ref != "main":
                  raise GuardError(f"owner-authority review must target main, not {base_ref!r}")

              changed_files = tuple(
                  normalize_path(value)
                  for value in require_list(evidence.get("changed_files"), "changed_files")
              )
              if not changed_files:
                  raise GuardError("pull request contains no changed files")

              manifest_paths = tuple(
                  normalize_path(value)
                  for value in require_list(manifest.get("constitutional_files"), "constitutional_files")
              )
              protected_paths = tuple(
                  path
                  for path in changed_files
                  if path in PROTECTED_EXACT_PATHS
                  or path.startswith(PROTECTED_PREFIXES)
                  or path in set(manifest_paths)
              )

              commits = require_list(evidence.get("commits"), "commits")
              validate_verified_commits(commits)

              owner_authored = identity_matches(author, owner_login, owner_id)
              if protected_paths and not owner_authored:
                  raise GuardError(
                      "only the pinned owner identity may author constitutional/control-plane "
                      "changes; protected paths: " + ", ".join(protected_paths)
                  )
              if protected_paths and ISSUE_REFERENCE_RE.search(body) is None:
                  raise GuardError(
                      "constitutional/control-plane changes require an explicit 'Related to #N' "
                      "or 'Governance issue #N' reference in the pull request body"
                  )

              if not owner_authored:
                  reviews = require_list(evidence.get("reviews"), "reviews")
                  latest = latest_owner_review(reviews, owner_login, owner_id)
                  if latest is None:
                      raise GuardError(
                          "a non-owner pull request requires approval by the pinned owner identity"
                      )
                  if str(latest.get("state", "")).upper() != "APPROVED":
                      raise GuardError("the pinned owner's latest review is not APPROVED")
                  if latest.get("commit_id") != head_sha:
                      raise GuardError(
                          "owner approval is stale; it must apply to the current pull request head"
                      )
          except (OSError, json.JSONDecodeError, GuardError) as exc:
              print(f"FOUNDER_AUTHORITY_GUARD: FAIL: {exc}", file=sys.stderr)
              raise SystemExit(1)

          print("FOUNDER_AUTHORITY_GUARD: PASS")
          PY
