name: Bootstrap and merge Founder Authority repair PR 1907

on:
  push:
    branches:
      - bootstrap/1906-founder-authority-1907-once

permissions:
  contents: write
  issues: write
  pull-requests: write
  checks: write

concurrency:
  group: bootstrap-founder-authority-1907-merge-once
  cancel-in-progress: false

jobs:
  attest-and-merge:
    name: bootstrap-founder-authority-1907-merge-once
    if: github.repository == 'Voxterrae/HUB_Optimus'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Record atomic bootstrap start
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          body = (
              "## Atomic Founder Authority bootstrap started\n\n"
              f"- source commit: `{os.environ['SOURCE_SHA']}`\n"
              f"- workflow run: {os.environ['RUN_URL']}\n"
              "- target: exact PR #1907 only\n"
              "- sequence: pinned validation → corrected guard → protected squash merge\n"
          )
          request = urllib.request.Request(
              "https://api.github.com/repos/Voxterrae/HUB_Optimus/issues/1906/comments",
              data=json.dumps({"body": body}).encode("utf-8"),
              method="POST",
              headers={
                  "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "Content-Type": "application/json",
              },
          )
          with urllib.request.urlopen(request, timeout=30):
              pass
          PY

      - name: Checkout exact verified PR 1907 candidate
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: bc686df913f04906593abad67a1ae5e6760baf28
          fetch-depth: 2
          persist-credentials: false

      - name: Verify pinned candidate identity
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "bc686df913f04906593abad67a1ae5e6760baf28"
          test "$(git rev-parse 'HEAD^{tree}')" = "21dac8069fb689bbeb6cdbe62342e70082ece955"
          test "$(git rev-parse HEAD^)" = "30e985226347b4bc59b0e187b96633a09647ca42"

      - name: Build exact live pull-request event
        id: event
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import json
          import os
          import pathlib
          import urllib.request

          repo = "Voxterrae/HUB_Optimus"
          pr_number = 1907
          expected_head = "bc686df913f04906593abad67a1ae5e6760baf28"
          expected_base = "30e985226347b4bc59b0e187b96633a09647ca42"

          request = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/pulls/{pr_number}",
              headers={
                  "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              pull = json.load(response)

          if pull.get("state") != "open" or pull.get("merged") is not False:
              raise SystemExit("PR #1907 must remain open and unmerged")
          if (pull.get("head") or {}).get("sha") != expected_head:
              raise SystemExit("PR #1907 head changed")
          if (pull.get("base") or {}).get("sha") != expected_base:
              raise SystemExit("PR #1907 base changed")

          merge_sha = pull.get("merge_commit_sha")
          if not isinstance(merge_sha, str) or len(merge_sha) != 40:
              raise SystemExit("PR #1907 live test merge commit is unavailable")

          base_repo = (pull.get("base") or {}).get("repo") or {}
          event = {
              "repository": {
                  "full_name": base_repo.get("full_name"),
                  "id": base_repo.get("id"),
                  "owner": base_repo.get("owner"),
              },
              "pull_request": pull,
          }
          event_path = pathlib.Path(os.environ["RUNNER_TEMP"]) / "pr-1907-atomic-event.json"
          event_path.write_text(
              json.dumps(event, ensure_ascii=False) + "\n", encoding="utf-8"
          )
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              env_file.write(f"FOUNDER_EVENT_PATH={event_path}\n")
              env_file.write(f"LIVE_MERGE_SHA={merge_sha}\n")
          print(f"live_merge_candidate={merge_sha}")
          PY

      - name: Publish corrected fail-closed Founder Authority result
        id: guard
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PYTHONPATH: .
        run: |
          set -euo pipefail
          GITHUB_EVENT_PATH="$FOUNDER_EVENT_PATH" \
            python .github/scripts/founder_authority_workflow.py \
            2>&1 | tee "$RUNNER_TEMP/founder-authority-1907-atomic.log"

      - name: Protected squash merge of exact PR 1907
        id: merge
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          from __future__ import annotations

          import json
          import os
          import pathlib
          import urllib.error
          import urllib.request

          expected_head = "bc686df913f04906593abad67a1ae5e6760baf28"
          payload = {
              "sha": expected_head,
              "merge_method": "squash",
              "commit_title": "governance: publish founder authority on live merge candidate (#1906)",
              "commit_message": (
                  "Merge the reviewed two-file Founder Authority Guard repair. "
                  "The exact candidate publishes the same fail-closed semantic result "
                  "on the PR head and live test merge commit. No core/runtime, API, "
                  "schema, Pages, permission or CODEOWNERS change."
              ),
          }
          request = urllib.request.Request(
              "https://api.github.com/repos/Voxterrae/HUB_Optimus/pulls/1907/merge",
              data=json.dumps(payload).encode("utf-8"),
              method="PUT",
              headers={
                  "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "Content-Type": "application/json",
              },
          )
          result_path = pathlib.Path(os.environ["RUNNER_TEMP"]) / "pr-1907-merge-result.json"
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  result = json.load(response)
          except urllib.error.HTTPError as exc:
              raw = exc.read().decode("utf-8", errors="replace")
              result_path.write_text(raw + "\n", encoding="utf-8")
              raise SystemExit(f"protected merge failed with HTTP {exc.code}: {raw}")

          result_path.write_text(
              json.dumps(result, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )
          if result.get("merged") is not True:
              raise SystemExit(f"GitHub did not merge PR #1907: {result}")
          merged_sha = result.get("sha")
          if not isinstance(merged_sha, str) or len(merged_sha) != 40:
              raise SystemExit("merged PR #1907 returned an invalid commit SHA")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              env_file.write(f"MERGED_SHA={merged_sha}\n")
          print(f"merged_sha={merged_sha}")
          PY

      - name: Record atomic bootstrap result
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SOURCE_SHA: ${{ github.sha }}
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          EVENT_OUTCOME: ${{ steps.event.outcome }}
          GUARD_OUTCOME: ${{ steps.guard.outcome }}
          MERGE_OUTCOME: ${{ steps.merge.outcome }}
          LIVE_MERGE_SHA: ${{ env.LIVE_MERGE_SHA }}
          MERGED_SHA: ${{ env.MERGED_SHA }}
        run: |
          python - <<'PY'
          import json
          import os
          import pathlib
          import urllib.request

          runner_temp = pathlib.Path(os.environ["RUNNER_TEMP"])
          guard_path = runner_temp / "founder-authority-1907-atomic.log"
          merge_path = runner_temp / "pr-1907-merge-result.json"
          guard_log = guard_path.read_text(encoding="utf-8", errors="replace")[-5000:] if guard_path.exists() else "[guard log unavailable]"
          merge_log = merge_path.read_text(encoding="utf-8", errors="replace")[-3000:] if merge_path.exists() else "[merge result unavailable]"
          body = (
              "## Atomic Founder Authority bootstrap result\n\n"
              f"- source commit: `{os.environ['SOURCE_SHA']}`\n"
              f"- workflow run: {os.environ['RUN_URL']}\n"
              f"- checkout: `{os.environ.get('CHECKOUT_OUTCOME', '')}`\n"
              f"- pinned identity: `{os.environ.get('VERIFY_OUTCOME', '')}`\n"
              f"- live event: `{os.environ.get('EVENT_OUTCOME', '')}`\n"
              f"- corrected guard: `{os.environ.get('GUARD_OUTCOME', '')}`\n"
              f"- protected merge: `{os.environ.get('MERGE_OUTCOME', '')}`\n"
              f"- attested merge candidate: `{os.environ.get('LIVE_MERGE_SHA', '')}`\n"
              f"- merged main SHA: `{os.environ.get('MERGED_SHA', '')}`\n\n"
              "### Guard\n```text\n"
              f"{guard_log}\n"
              "```\n\n### Merge result\n```json\n"
              f"{merge_log}\n"
              "```\n"
          )
          request = urllib.request.Request(
              "https://api.github.com/repos/Voxterrae/HUB_Optimus/issues/1906/comments",
              data=json.dumps({"body": body}).encode("utf-8"),
              method="POST",
              headers={
                  "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "Content-Type": "application/json",
              },
          )
          with urllib.request.urlopen(request, timeout=30):
              pass
          PY
