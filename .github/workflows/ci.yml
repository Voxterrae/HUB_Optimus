name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Check docs encoding (mojibake guard)
        run: python tools/check_mojibake.py .

      - name: Narrative consistency check
        run: |
          python tools/check_narrative_consistency.py \
            --input datasets/ai_risk_narratives/seed_claims.json \
            --taxonomy datasets/ai_risk_narratives/taxonomy.json \
            --report out/narrative_consistency.json \
            --summary-file "$GITHUB_STEP_SUMMARY"

      - name: Run tests
        run: python -m pytest -q

  powershell-tooling:
    name: PowerShell tooling
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Require PowerShell 7
        shell: bash
        run: |
          if ! command -v pwsh >/dev/null 2>&1; then
            echo "::error::PowerShell 7 (pwsh) is required for tooling certification"
            exit 1
          fi
          pwsh -NoProfile -NonInteractive -Command '
            if ($PSVersionTable.PSVersion.Major -lt 7) {
              Write-Error "PowerShell 7 or newer is required"
              exit 1
            }
          '

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run PowerShell tooling behavior tests
        run: python -m pytest -q tests/test_powershell_tooling_safety.py

  benchmarks:
    name: Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run benchmark pack v0 (non-blocking)
        run: python benchmarks/run_benchmarks.py --summary-file "$GITHUB_STEP_SUMMARY"
