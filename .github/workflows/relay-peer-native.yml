name: Relay bootstrap peer SQOS regression

on:
  push:
    branches:
      - codex/relay-peer-sqos-20261101
    paths:
      - .github/workflows/relay-peer-native.yml
      - products/device-bridge/windows/native-pilot/src/bootstrap_peer.rs
      - products/device-bridge/windows/native-pilot/src/bootstrap_peer/tests.rs

permissions:
  contents: read

concurrency:
  group: relay-peer-sqos-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: pwsh

jobs:
  peer:
    name: Native peer context regression (Windows)
    if: >-
      github.repository == 'Voxterrae/HUB_Optimus' &&
      github.actor == 'Voxterrae' && github.actor_id == '249308740' &&
      github.event.repository.private == false
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - name: Checkout exact proposed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Check capacity and select fixed compiler
        run: |
          $ErrorActionPreference = 'Stop'
          $drive = (Get-Item -LiteralPath $env:RUNNER_TEMP).PSDrive
          if ($drive.Free -lt 2147483648) { throw 'Disposable runner capacity below 2 GiB.' }
          rustup toolchain install 1.99.0 --profile minimal
          if ($LASTEXITCODE -ne 0) { throw 'Fixed compiler installation failed.' }
          rustup run 1.99.0 rustc --version
          if ($LASTEXITCODE -ne 0) { throw 'Fixed compiler unavailable.' }

      - name: Compile peer test harness without executing other native modules
        run: |
          $ErrorActionPreference = 'Stop'
          $manifest = 'products/device-bridge/windows/native-pilot/Cargo.toml'
          $target = Join-Path $env:RUNNER_TEMP 'relay-peer-target'
          rustup run 1.99.0 cargo test --manifest-path $manifest --target-dir $target --locked --no-run
          if ($LASTEXITCODE -ne 0) { throw 'Native peer test compilation failed.' }

      - name: Execute only peer tests and publish redacted outcomes
        run: |
          $ErrorActionPreference = 'Stop'
          $manifest = 'products/device-bridge/windows/native-pilot/Cargo.toml'
          $target = Join-Path $env:RUNNER_TEMP 'relay-peer-target'
          $privateLog = Join-Path $env:RUNNER_TEMP 'relay-peer-native-private.txt'
          try {
            rustup run 1.99.0 cargo test --manifest-path $manifest --target-dir $target --locked --offline bootstrap_peer::tests -- --test-threads=1 *> $privateLog
            $testExit = $LASTEXITCODE
            $lines = @(Get-Content -LiteralPath $privateLog)
            $names = @($lines | Where-Object { $_ -match '^test bootstrap_peer::tests::[a-zA-Z0-9_]+ \.\.\. (ok|FAILED|ignored(?:, subprocess fixture entry; exercised by native parent tests)?)$' })
            $summaries = @($lines | Where-Object { $_ -match '^test result: (ok|FAILED)\. [0-9]+ passed; [0-9]+ failed; [0-9]+ ignored; [0-9]+ measured; [0-9]+ filtered out;' })
            $names | ForEach-Object { Write-Output $_ }
            $summaries | ForEach-Object { Write-Output $_ }
            if ($names.Count -eq 0 -or $summaries.Count -eq 0) { throw 'No attributable native test result.' }
            if ($testExit -ne 0) { throw 'Peer regression failed; native assertion details remain private.' }
            $ignored = @($names | Where-Object { $_ -match ' \.\.\. ignored' })
            if ($ignored.Count -ne 1 -or $ignored[0] -notmatch '^test bootstrap_peer::tests::native_child_entry \.\.\. ignored, subprocess fixture entry; exercised by native parent tests$') { throw 'Unexpected skipped peer case.' }
            if ($summaries[-1] -notmatch '^test result: ok\. [1-9][0-9]* passed; 0 failed; 1 ignored;') { throw 'Peer suite incomplete.' }
            Write-Output 'The single ignored entry is the child fixture invoked explicitly by parent tests; not a passing security case.'
            Write-Output 'Peer-only test scope; no CNG or HTTP.sys tests, service, root or key activation.'
          } finally {
            Remove-Item -LiteralPath $privateLog -Force -ErrorAction SilentlyContinue
          }
