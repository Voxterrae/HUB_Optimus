name: Optimus Admin Gateway

on:
  pull_request:
    paths:
      - 'products/admin-gateway/**'
      - '.github/workflows/optimus-admin-gateway.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-contract:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: products/admin-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install module test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run API and safety tests
        run: pytest -q
      - name: Generate and validate OpenAPI JSON
        run: |
          python scripts/export-openapi.py
          python -m json.tool openapi/optimus-admin-gateway.openapi.json >/dev/null

  powershell-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse PowerShell 7 runbooks
        shell: pwsh
        run: |
          $files = Get-ChildItem -Recurse products/admin-gateway/runbooks -Filter *.ps1
          $failed = $false
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $failed = $true
              $errors | ForEach-Object { Write-Error "$($file.FullName): $($_.Message)" }
            }
          }
          if ($failed) { exit 1 }
          $content = Get-Content -Raw products/admin-gateway/runbooks/Invoke-OptimusExchangeOperation.ps1
          if ($content -match 'Invoke-Expression') { throw 'Dynamic execution is forbidden.' }
          if ($content -notmatch '\[bool\]\$DryRun = \$true') { throw 'DryRun must default to true.' }
