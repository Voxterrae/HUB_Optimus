name: Optimus Admin Gateway

on:
  push:
    branches: [main]
    paths:
      - 'products/admin-gateway/**'
      - '.github/workflows/optimus-admin-gateway.yml'
  pull_request:
    paths:
      - 'products/admin-gateway/**'
      - '.github/workflows/optimus-admin-gateway.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-contract:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: products/admin-gateway
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Install module test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run API, authentication and Dataverse applicator contract tests
        run: python -m pytest -q
      - name: Verify offline Dataverse applicator binding
        run: python scripts/apply-dataverse-schema.py
      - name: Verify deterministic package manifest
        run: python scripts/build-package-manifest.py

  powershell-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Parse and inspect all PowerShell 7 assets
        shell: pwsh
        run: |
          function Find-ForbiddenDynamicExecution {
            param(
              [Parameter(Mandatory)]
              [System.Management.Automation.Language.Ast]$Ast
            )

            @($Ast.FindAll({
              param($node)

              if ($node -is [System.Management.Automation.Language.CommandAst]) {
                $commandName = $node.GetCommandName()
                if ($null -eq $commandName) {
                  return $false
                }

                $leafName = ($commandName -split '\\')[-1]
                return ($leafName -ieq 'Invoke-Expression') -or
                  ($leafName -ieq 'iex')
              }

              if ($node -isnot [System.Management.Automation.Language.InvokeMemberExpressionAst]) {
                return $false
              }
              if ($node.Member -isnot [System.Management.Automation.Language.StringConstantExpressionAst]) {
                return $false
              }

              $memberName = $node.Member.Value
              if ($memberName -ieq 'DownloadString') {
                return $true
              }

              if (-not $node.Static -or $memberName -ine 'Create') {
                return $false
              }
              if ($node.Expression -isnot [System.Management.Automation.Language.TypeExpressionAst]) {
                return $false
              }

              $typeName = $node.Expression.TypeName.FullName
              return ($typeName -ieq 'ScriptBlock') -or
                ($typeName -ieq 'System.Management.Automation.ScriptBlock')
            }, $true))
          }

          $scannerFixtures = @(
            @{
              Name = 'inert words'
              Source = (@(
                '# Invoke-Expression iex DownloadString [ScriptBlock]::Create'
                '$label = ''Invoke-Expression iex DownloadString [ScriptBlock]::Create'''
                '$content | Should -Not -Match ''Invoke-Expression'''
              ) -join "`n")
              Expected = 0
            }
            @{ Name = 'Invoke-Expression'; Source = 'Invoke-Expression ''payload'''; Expected = 1 }
            @{ Name = 'iex'; Source = 'iex ''payload'''; Expected = 1 }
            @{
              Name = 'call-operator Invoke-Expression'
              Source = '& ''Invoke-Expression'' ''payload'''
              Expected = 1
            }
            @{
              Name = 'module-qualified Invoke-Expression'
              Source = 'Microsoft.PowerShell.Utility\Invoke-Expression ''payload'''
              Expected = 1
            }
            @{ Name = 'DownloadString'; Source = '$client.DownloadString(''payload'')'; Expected = 1 }
            @{
              Name = 'ScriptBlock.Create'
              Source = '[ScriptBlock]::Create(''payload'')'
              Expected = 1
            }
            @{
              Name = 'fully-qualified ScriptBlock.Create'
              Source = '[System.Management.Automation.ScriptBlock]::Create(''payload'')'
              Expected = 1
            }
          )

          foreach ($fixture in $scannerFixtures) {
            $fixtureTokens = $null
            $fixtureErrors = $null
            $fixtureAst = [System.Management.Automation.Language.Parser]::ParseInput(
              $fixture.Source,
              [ref]$fixtureTokens,
              [ref]$fixtureErrors
            )
            if ($fixtureErrors.Count -gt 0) {
              throw "AST scanner fixture failed to parse: $($fixture.Name)"
            }

            $fixtureFindings = @(Find-ForbiddenDynamicExecution -Ast $fixtureAst)
            if ($fixtureFindings.Count -ne $fixture.Expected) {
              throw "AST scanner self-test failed: $($fixture.Name)"
            }
          }
          Write-Host 'Executable-AST scanner self-test: PASS'

          $files = Get-ChildItem -Recurse products/admin-gateway -Filter *.ps1
          if ($files.Count -eq 0) { throw 'No PowerShell assets found.' }
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            $ast = [System.Management.Automation.Language.Parser]::ParseFile(
              $file.FullName,
              [ref]$tokens,
              [ref]$errors
            )
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "$($file.FullName): $($_.Message)" }
              throw "PowerShell parse failed for $($file.FullName)."
            }

            $forbiddenNodes = @(Find-ForbiddenDynamicExecution -Ast $ast)
            if ($forbiddenNodes.Count -gt 0) {
              $details = $forbiddenNodes | ForEach-Object {
                '{0}:{1}:{2}: {3}' -f
                  $file.FullName,
                  $_.Extent.StartLineNumber,
                  $_.Extent.StartColumnNumber,
                  $_.Extent.Text
              }
              throw "Dynamic execution is forbidden:`n$($details -join "`n")"
            }
          }
          $runbook = Get-Content -Raw products/admin-gateway/runbooks/Invoke-OptimusExchangeOperation.ps1
          if ($runbook -notmatch '\[bool\]\$DryRun = \$true') {
            throw 'DryRun must default to true.'
          }
          $applyWrapper = Get-Content -Raw products/admin-gateway/dataverse/pac/Invoke-OptimusDataverseSchemaApply.ps1
          if ($applyWrapper -notmatch 'DefaultParameterSetName\s*=\s*''Offline''') {
            throw 'Dataverse applicator wrapper must default to Offline.'
          }
          if ($applyWrapper -notmatch '\[switch\]\$Apply') {
            throw 'Dataverse metadata writes require an explicit Apply switch.'
          }
      - name: Run PowerShell safety contracts
        shell: pwsh
        run: |
          Import-Module Pester -MinimumVersion 5.0 -ErrorAction Stop
          Invoke-Pester -Path products/admin-gateway/runbooks/tests -CI
