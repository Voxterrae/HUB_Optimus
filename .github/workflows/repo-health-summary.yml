name: Repo Health Summary

on:
  schedule:
    - cron: "0 8 * * 1"   # weekly Monday 08:00 UTC
  workflow_dispatch:       # manual trigger

concurrency:
  group: repo-health-summary
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  summary:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository metadata
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Gather and post health summary
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          rm -f body.md

          echo "Event: ${GITHUB_EVENT_NAME} | Actor: ${GITHUB_ACTOR}"

          # GitHub CLI list commands default to 30 results. Fetch one item beyond
          # the documented ceiling so a repository that exceeds the audit
          # boundary fails closed instead of publishing a partial count.
          GH_LIST_COUNT_CEILING=10000
          GH_LIST_FETCH_LIMIT=$((GH_LIST_COUNT_CEILING + 1))

          fetch_gh_list() {
            local resource="$1"
            local fields="$2"
            shift 2
            local output
            local count

            if ! output=$(gh "$resource" list \
              --limit "$GH_LIST_FETCH_LIMIT" \
              --json "$fields" \
              "$@"); then
              echo "::error::Failed to fetch GitHub ${resource} list; no health summary was published." >&2
              return 1
            fi

            if ! count=$(jq -er \
              'if type == "array" then length else error("expected an array") end' \
              <<<"$output"); then
              echo "::error::GitHub ${resource} list returned invalid JSON; no health summary was published." >&2
              return 1
            fi

            if [ "$count" -gt "$GH_LIST_COUNT_CEILING" ]; then
              echo "::error::GitHub ${resource} list exceeds the ${GH_LIST_COUNT_CEILING}-item audit ceiling; no partial summary was published." >&2
              return 1
            fi

            printf '%s\n' "$output"
          }

          # --- Core metrics ---
          OPEN_PRS_JSON=$(fetch_gh_list pr number,author --state open)
          OPEN_ISSUES_JSON=$(fetch_gh_list issue number --state open)
          PRS=$(jq -r 'length' <<<"$OPEN_PRS_JSON")
          ISSUES=$(jq -r 'length' <<<"$OPEN_ISSUES_JSON")
          LAST5=$(gh run list --limit 5 --json conclusion --jq '.[].conclusion' | tr '\n' ' ')
          FAILURES=$(gh run list --limit 10 --json conclusion --jq '[.[] | select(.conclusion=="failure")] | length')
          LAST_COMMIT=$(git log -1 --pretty=format:"%h %s")
          DATE=$(date -u +"%Y-%m-%d %H:%M UTC")

          # --- Extended metrics ---
          if ! REMOTE_HEADS=$(git ls-remote --heads origin); then
            echo "::error::Failed to fetch remote branch refs; no health summary was published." >&2
            exit 1
          fi
          BRANCHES=$(awk 'NF { count += 1 } END { print count + 0 }' <<<"$REMOTE_HEADS")
          BOT_BRANCHES=$(awk \
            '$2 ~ /^refs\/heads\/chore\/maintenance-/ { count += 1 } END { print count + 0 }' \
            <<<"$REMOTE_HEADS")
          WEEK_AGO=$(date -u -d '7 days ago' +"%Y-%m-%dT%H:%M:%SZ")
          CLOSED_PRS_JSON=$(fetch_gh_list pr closedAt --state closed)
          ALL_PRS_JSON=$(fetch_gh_list pr createdAt,author --state all)
          ALL_ISSUES_JSON=$(fetch_gh_list issue createdAt --state all)
          PRS_CLOSED_WEEK=$(jq -r \
            --arg week_ago "$WEEK_AGO" \
            '[.[] | select(.closedAt >= $week_ago)] | length' \
            <<<"$CLOSED_PRS_JSON")
          PRS_OPENED_WEEK=$(jq -r \
            --arg week_ago "$WEEK_AGO" \
            '[.[] | select(.createdAt >= $week_ago)] | length' \
            <<<"$ALL_PRS_JSON")
          ISSUES_OPENED_WEEK=$(jq -r \
            --arg week_ago "$WEEK_AGO" \
            '[.[] | select(.createdAt >= $week_ago)] | length' \
            <<<"$ALL_ISSUES_JSON")

          # --- Automation actor analysis ---
          # This is an explicitly labelled 100-PR sample, not a repository count.
          TOP_PR_AUTHOR=$(jq -r \
            '.[0:100] | [.[].author.login] | group_by(.) | map({author: .[0], count: length}) | sort_by(-.count) | .[0] | "\(.author) (\(.count))"' \
            <<<"$ALL_PRS_JSON")
          DEPENDABOT_PRS=$(jq -r \
            '[.[] | select(.author.login == "dependabot[bot]")] | length' \
            <<<"$OPEN_PRS_JSON")

          # --- Anomaly detection ---
          ALERTS=""
          ALERT_COUNT=0

          if [ "$PRS" -gt 10 ]; then
            ALERTS="${ALERTS}"$'\n'"- ⚠️ **High open PRs (${PRS})** — check for bot loop or stale PRs."
            ALERT_COUNT=$((ALERT_COUNT + 1))
          fi

          if [ "$FAILURES" -gt 3 ]; then
            ALERTS="${ALERTS}"$'\n'"- ⚠️ **CI failures (${FAILURES}/10)** — investigate broken dependency or pipeline issue."
            ALERT_COUNT=$((ALERT_COUNT + 1))
          fi

          if [ "$BRANCHES" -gt 200 ]; then
            ALERTS="${ALERTS}"$'\n'"- ⚠️ **Branch flood (${BRANCHES} branches)** — possible runaway workflow or bot loop."
            ALERT_COUNT=$((ALERT_COUNT + 1))
          fi

          if [ "$BOT_BRANCHES" -gt 20 ]; then
            ALERTS="${ALERTS}"$'\n'"- ⚠️ **Maintenance bot branches (${BOT_BRANCHES} chore/maintenance-* branches)** — likely bot loop, clean up stale branches."
            ALERT_COUNT=$((ALERT_COUNT + 1))
          fi

          if [ "$PRS_OPENED_WEEK" -gt 5 ] && [ "$PRS_CLOSED_WEEK" -gt "$((PRS_OPENED_WEEK * 8 / 10))" ]; then
            ALERTS="${ALERTS}"$'\n'"- ⚠️ **High PR close ratio (${PRS_CLOSED_WEEK} closed / ${PRS_OPENED_WEEK} opened this week)** — possible automated PR flood."
            ALERT_COUNT=$((ALERT_COUNT + 1))
          fi

          if [ "$ISSUES_OPENED_WEEK" -gt 20 ]; then
            ALERTS="${ALERTS}"$'\n'"- ⚠️ **Issue burst (${ISSUES_OPENED_WEEK} new issues this week)** — possible spam or automation."
            ALERT_COUNT=$((ALERT_COUNT + 1))
          fi

          if [ "$DEPENDABOT_PRS" -gt 10 ]; then
            ALERTS="${ALERTS}"$'\n'"- ⚠️ **Dependabot storm (${DEPENDABOT_PRS} open PRs)** — review dependency update flood."
            ALERT_COUNT=$((ALERT_COUNT + 1))
          fi

          if [ "$ALERT_COUNT" -eq 0 ]; then
            STATUS="✅ All clear"
            ANOMALY_SECTION="> No anomalies detected."
          else
            STATUS="⚠️ ${ALERT_COUNT} anomaly warning(s)"
            ANOMALY_SECTION="${ALERTS}"
          fi

          # --- Compose ledger entry via temp file ---
          {
            echo "<details>"
            echo "<summary>📊 Weekly Repository Health Snapshot — ${DATE} | ${STATUS}</summary>"
            echo ""
            echo "| Metric | Value |"
            echo "|---|---|"
            echo "| Open PRs | ${PRS} |"
            echo "| Open Issues | ${ISSUES} |"
            echo "| CI (last 5) | ${LAST5} |"
            echo "| CI failures (last 10) | ${FAILURES} |"
            echo "| Branches | ${BRANCHES} |"
            echo "| Bot branches (chore/maintenance-*) | ${BOT_BRANCHES} |"
            echo "| PRs opened (7d) | ${PRS_OPENED_WEEK} |"
            echo "| PRs closed (7d) | ${PRS_CLOSED_WEEK} |"
            echo "| Issues opened (7d) | ${ISSUES_OPENED_WEEK} |"
            echo "| Top PR author (last 100) | ${TOP_PR_AUTHOR} |"
            echo "| Dependabot open PRs | ${DEPENDABOT_PRS} |"
            echo "| Latest commit | \`${LAST_COMMIT}\` |"
            echo "| Status | **${STATUS}** |"
            echo ""
            echo "#### Anomaly Warnings"
            echo "${ANOMALY_SECTION}"
            echo ""
            echo "</details>"
            echo ""
            echo "<sub>Monitoring version: v1.0</sub>"
            echo ""
            echo "---"
            echo "*Generated by repo-health-summary workflow*"
          } > body.md

          gh issue comment 93 --body-file body.md
