---
name: Repository maintenance drift

"on":
  # Schedule-only execution remains bound to the trusted default branch.
  # Issue #1788 replaces branch-producing maintenance with observation.
  schedule:
    - cron: "15 6 * * 1"

permissions:
  contents: read

jobs:
  maintenance-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Verify trusted main checkout
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "::error::Maintenance drift checks run only from refs/heads/main."
            exit 1
          fi
          checked_out="$(git rev-parse HEAD)"
          remote_main="$(git rev-parse origin/main)"
          if [ "${checked_out}" != "${GITHUB_SHA}" ] || [ "${checked_out}" != "${remote_main}" ]; then
            echo "::error::Checkout does not match the trusted origin/main commit."
            exit 1
          fi
          if ! git diff --quiet || ! git diff --cached --quiet; then
            echo "::error::Tracked checkout changes exist before the drift check."
            exit 1
          fi
          if [ -n "$(git ls-files --others --exclude-standard)" ]; then
            echo "::error::Untracked checkout files exist before the drift check."
            exit 1
          fi

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Check maintenance drift without writes
        run: python tools/check_maintenance_drift.py --mode full
