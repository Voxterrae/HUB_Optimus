# HUB_Optimus owner/team Operator boundary.
#
# Intended install path:
#   /etc/nginx/conf.d/hub-optimus-operator-api.conf
#
# Required external files (never commit their contents):
#   /etc/letsencrypt/live/api.huboptimus.dev/fullchain.pem
#   /etc/letsencrypt/live/api.huboptimus.dev/privkey.pem
#   /etc/hub-optimus/secrets/operator-intake-capability.conf
#
# The capability include is root-managed, mode 0640, and defines the
# $hub_internal_capability variable exactly once.  Its absence makes nginx
# configuration validation fail closed.

server_tokens off;

limit_req_zone $binary_remote_addr zone=hub_optimus_intake_per_ip:10m rate=12r/m;
limit_conn_zone $binary_remote_addr zone=hub_optimus_connections_per_ip:10m;

# NGINX otherwise uses 503 and an HTML body for these limit modules.  A 429
# enters the JSON error handler in the canonical TLS server instead.
limit_req_status 429;
limit_conn_status 429;
limit_req_log_level warn;
limit_conn_log_level warn;

map $uri $hub_allow_methods {
    default "GET, HEAD";
    "/api/intake" "POST";
    "/oauth2/start" "GET";
    "/oauth2/callback" "GET";
    "/oauth2/sign_out" "GET";
}

# Unknown HTTP hosts are never redirected to the canonical host.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

# Unknown TLS SNI names fail during the handshake without a default certificate.
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}

# The one accepted plaintext host redirects to a literal HTTPS authority, so a
# supplied Host header can never influence the destination.
server {
    listen 80;
    listen [::]:80;
    server_name api.huboptimus.dev;
    return 308 https://api.huboptimus.dev$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.huboptimus.dev;

    ssl_certificate /etc/letsencrypt/live/api.huboptimus.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.huboptimus.dev/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;

    include /etc/hub-optimus/secrets/operator-intake-capability.conf;

    add_header Cache-Control "no-store" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Request-ID req_$request_id always;

    # Every locally generated edge failure has a JSON body and the same
    # request ID in its body and response header.  recursive_error_pages stays
    # off so these controlled handlers cannot recurse.
    recursive_error_pages off;
    error_page 400 = @invalid_request;
    error_page 401 = @authentication_required;
    error_page 403 = @forbidden;
    error_page 404 = @not_found;
    error_page 405 = @method_not_allowed;
    error_page 408 = @request_timeout;
    error_page 413 = @request_too_large;
    error_page 429 = @rate_limited;
    error_page 500 = @internal_error;
    error_page 502 = @upstream_unavailable;
    error_page 503 = @upstream_busy;
    error_page 504 = @upstream_timeout;

    # A public liveness response deliberately reveals no backend, release,
    # identity-provider or dependency state.
    location = /health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    # The auth_request endpoint is never callable by a public client.  Only
    # the session cookie and fixed proxy context reach oauth2-proxy.
    location = /oauth2/auth {
        internal;
        access_log off;
        proxy_pass http://127.0.0.1:4180/oauth2/auth;
        proxy_http_version 1.1;
        proxy_pass_request_headers off;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Host api.huboptimus.dev;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host api.huboptimus.dev;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Uri $request_uri;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Authorization "";
        proxy_set_header Proxy-Authorization "";
        proxy_next_upstream off;
    }

    # The browser may supply rd, but NGINX replaces it with this one literal
    # post-login destination.  No arbitrary oauth2-proxy route is public.
    location = /oauth2/start {
        if ($request_method != GET) {
            return 405;
        }
        access_log off;
        proxy_intercept_errors on;
        proxy_pass http://127.0.0.1:4180/oauth2/start?rd=https%3A%2F%2Fapi.huboptimus.dev%2Foperator%2F;
        proxy_http_version 1.1;
        proxy_pass_request_headers off;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Host api.huboptimus.dev;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host api.huboptimus.dev;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
        proxy_next_upstream off;
    }

    # Authorization code and state exist only in this callback query.  Neither
    # access logs nor error logs may receive it.  oauth2-proxy request/auth logs
    # are independently disabled by its reviewed configuration.
    location = /oauth2/callback {
        if ($request_method != GET) {
            return 405;
        }
        access_log off;
        error_log /dev/null crit;
        # Server-level error handlers would be internal redirects, and NGINX
        # logs a request in the context where processing ends. Keep callback
        # failures in callback-only handlers so code/state can never re-enter
        # either access or error logs after such a redirect.
        error_page 400 401 403 404 408 413 429 500 502 503 504 = @oauth2_callback_failed;
        error_page 405 = @oauth2_callback_method_not_allowed;
        proxy_intercept_errors on;
        proxy_pass http://127.0.0.1:4180;
        proxy_http_version 1.1;
        proxy_pass_request_headers off;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Host api.huboptimus.dev;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host api.huboptimus.dev;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
        proxy_next_upstream off;
    }

    # Sign-out always returns to the fixed public confirmation page.  A caller
    # cannot replace rd with an external target.
    location = /oauth2/sign_out {
        if ($request_method != GET) {
            return 405;
        }
        access_log off;
        proxy_intercept_errors on;
        proxy_pass http://127.0.0.1:4180/oauth2/sign_out?rd=%2Fsigned-out;
        proxy_http_version 1.1;
        proxy_pass_request_headers off;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Host api.huboptimus.dev;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host api.huboptimus.dev;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
        proxy_next_upstream off;
    }

    # Public, static and script-free confirmation after the host-only session
    # cookie has been cleared.  Links use literal authorities.
    location = /signed-out {
        if ($request_method !~ ^(GET|HEAD)$) {
            return 405;
        }
        access_log off;
        default_type text/html;
        charset utf-8;
        return 200 '<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HUB_Optimus signed out</title><main><h1>Signed out</h1><p>The private Operator session has ended.</p><p><a href="https://huboptimus.dev/">Open the public site</a> · <a href="https://api.huboptimus.dev/oauth2/start?rd=https%3A%2F%2Fapi.huboptimus.dev%2Foperator%2F">Sign in again</a></p></main></html>';
    }

    location = /operator {
        return 308 https://api.huboptimus.dev/operator/;
    }

    # Static Operator files and the landing-page path/dependencies referenced
    # by ../?lang=... are all private and come from the reviewed release.
    location ^~ /operator/ {
        auth_request /oauth2/auth;
        root /opt/hub-optimus/current/site;
        try_files $uri $uri/ =404;
    }

    location = / {
        auth_request /oauth2/auth;
        root /opt/hub-optimus/current/site;
        try_files /index.html =404;
    }

    location ^~ /assets/ {
        auth_request /oauth2/auth;
        root /opt/hub-optimus/current/site;
        try_files $uri =404;
    }

    location ^~ /i18n/ {
        auth_request /oauth2/auth;
        root /opt/hub-optimus/current/site;
        try_files $uri =404;
    }

    location = /styles.css {
        auth_request /oauth2/auth;
        root /opt/hub-optimus/current/site;
        try_files $uri =404;
    }

    location = /globe.js {
        auth_request /oauth2/auth;
        root /opt/hub-optimus/current/site;
        try_files $uri =404;
    }

    location = /app.js {
        auth_request /oauth2/auth;
        root /opt/hub-optimus/current/site;
        try_files $uri =404;
    }

    # Same-origin, authenticated URL intake.  No preflight or cross-origin
    # request is supported: this endpoint accepts one method and one Origin.
    location = /api/intake {
        if ($request_method != POST) {
            return 405;
        }
        if ($http_origin != "https://api.huboptimus.dev") {
            return 403;
        }

        auth_request /oauth2/auth;
        auth_request_set $hub_authenticated_subject $upstream_http_x_auth_request_user;
        auth_request_set $hub_authenticated_roles $upstream_http_x_auth_request_groups;

        limit_req zone=hub_optimus_intake_per_ip burst=6 nodelay;
        limit_conn hub_optimus_connections_per_ip 4;
        client_max_body_size 8k;
        client_body_timeout 5s;

        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
        send_timeout 15s;
        proxy_next_upstream off;
        proxy_request_buffering on;
        # Preserve versioned JSON errors emitted by the gateway.  Connection,
        # timeout and protocol failures generated by NGINX still enter the
        # server-level 502/503/504 handlers above.
        proxy_intercept_errors off;
        # A buffered HTTP/1.0 hop guarantees Content-Length framing; the
        # gateway rejects chunked transfer encoding by contract.
        proxy_http_version 1.0;

        # Deny the client header namespace by default, then construct the
        # gateway request from this explicit allowlist.  In particular, no
        # browser Cookie, OAuth token, Authorization, Basic Auth or forged
        # X-Hub/X-Auth identity reaches the gateway.
        proxy_pass_request_headers off;
        proxy_set_header Host 127.0.0.1:8081;
        proxy_set_header Content-Type $http_content_type;
        # NGINX regenerates Content-Length from the buffered body.  Do not
        # forward a client-supplied framing value.
        proxy_set_header Origin https://api.huboptimus.dev;
        proxy_set_header X-Hub-Internal-Capability $hub_internal_capability;
        proxy_set_header X-Hub-Authenticated-Subject $hub_authenticated_subject;
        proxy_set_header X-Hub-Authenticated-Roles $hub_authenticated_roles;
        proxy_set_header X-Hub-Client-IP $remote_addr;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_set_header Proxy-Authorization "";
        proxy_set_header X-Auth-Request-Access-Token "";
        proxy_set_header X-Forwarded-Access-Token "";

        # The public route is translated to the gateway's one internal route;
        # no request is ever proxied directly to the local hub-api process.
        proxy_pass http://127.0.0.1:8081/intake/url;
    }

    location @oauth2_callback_failed {
        internal;
        access_log off;
        error_log /dev/null crit;
        default_type application/json;
        return 502 '{"error":"authentication_callback_failed","request_id":"req_$request_id"}';
    }

    location @oauth2_callback_method_not_allowed {
        internal;
        access_log off;
        error_log /dev/null crit;
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Request-ID req_$request_id always;
        add_header Allow "GET" always;
        return 405 '{"error":"method_not_allowed","request_id":"req_$request_id"}';
    }

    location @invalid_request {
        internal;
        default_type application/json;
        return 400 '{"error":"invalid_request","request_id":"req_$request_id"}';
    }

    location @authentication_required {
        internal;
        default_type application/json;
        return 401 '{"error":"authentication_required","request_id":"req_$request_id"}';
    }

    location @forbidden {
        internal;
        default_type application/json;
        return 403 '{"error":"forbidden","request_id":"req_$request_id"}';
    }

    location @not_found {
        internal;
        default_type application/json;
        return 404 '{"error":"not_found","request_id":"req_$request_id"}';
    }

    location @method_not_allowed {
        internal;
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Request-ID req_$request_id always;
        add_header Allow $hub_allow_methods always;
        return 405 '{"error":"method_not_allowed","request_id":"req_$request_id"}';
    }

    location @request_timeout {
        internal;
        default_type application/json;
        return 408 '{"error":"request_timeout","request_id":"req_$request_id"}';
    }

    location @request_too_large {
        internal;
        default_type application/json;
        return 413 '{"error":"request_too_large","request_id":"req_$request_id"}';
    }

    location @rate_limited {
        internal;
        default_type application/json;
        return 429 '{"error":"rate_limited","request_id":"req_$request_id"}';
    }

    location @internal_error {
        internal;
        default_type application/json;
        return 500 '{"error":"internal_error","request_id":"req_$request_id"}';
    }

    location @upstream_unavailable {
        internal;
        default_type application/json;
        return 502 '{"error":"upstream_unavailable","request_id":"req_$request_id"}';
    }

    location @upstream_busy {
        internal;
        default_type application/json;
        return 503 '{"error":"upstream_busy","request_id":"req_$request_id"}';
    }

    location @upstream_timeout {
        internal;
        default_type application/json;
        return 504 '{"error":"upstream_timeout","request_id":"req_$request_id"}';
    }

    location / {
        return 404;
    }
}
