<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0f14">
  <title>404 — HUB_Optimus</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0b0f14;
      color: #eae7dc;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 1.25rem;
      background:
        radial-gradient(circle at 16% 18%, rgb(11 61 145 / 24%), transparent 34rem),
        linear-gradient(145deg, #111923, #0b0f14 58%);
    }

    main {
      width: min(100%, 48rem);
      padding: clamp(1.5rem, 4vw, 3.5rem);
      border: 1px solid #263645;
      border-radius: 1.25rem;
      background: rgb(17 25 35 / 92%);
      box-shadow: 0 1.5rem 5rem rgb(0 0 0 / 32%);
    }

    .eyebrow {
      margin: 0 0 1rem;
      color: #d6a44f;
      font-size: .78rem;
      font-weight: 750;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.4rem, 8vw, 5rem);
      line-height: .95;
    }

    p {
      max-width: 62ch;
      margin: 1.25rem 0 0;
      color: #c8d0d8;
      line-height: 1.7;
    }

    nav {
      display: flex;
      flex-wrap: wrap;
      gap: .7rem;
      margin-top: 2rem;
    }

    a {
      display: inline-flex;
      align-items: center;
      min-height: 2.8rem;
      padding: .65rem 1rem;
      border: 1px solid #3b4d5d;
      border-radius: 999px;
      color: #eae7dc;
      font-weight: 700;
      text-decoration: none;
    }

    a:first-child {
      border-color: #d6a44f;
      background: #d6a44f;
      color: #0b0f14;
    }

    a:focus-visible,
    a:hover {
      outline: 2px solid #d6a44f;
      outline-offset: 3px;
    }

    .languages {
      color: #8ca0b3;
      font-size: .92rem;
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">HUB_Optimus · 404</p>
    <h1>Ruta no encontrada</h1>
    <p>Esta dirección no forma parte de la superficie pública versionada. Vuelve al portfolio o consulta el repositorio, que sigue siendo la fuente de verdad del proyecto.</p>
    <p class="languages">EN: Page not found. · DE: Seite nicht gefunden.</p>
    <nav aria-label="Rutas disponibles">
      <a href="/">Volver al portfolio</a>
      <a href="/operator/">Abrir Operator</a>
      <a href="https://github.com/Voxterrae/HUB_Optimus">Ver GitHub</a>
    </nav>
  </main>
</body>
</html>
